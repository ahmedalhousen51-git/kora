<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bar Station — Kora</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .login-card { width: 100%; max-width: 380px; padding: 32px 28px; text-align: center; }
  .login-icon { width: 52px; height: 52px; border-radius: 15px; background: var(--wine-100); color: var(--wine-700); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
  .demo-box { background: var(--gray-50); border: 1px solid var(--border); border-radius: var(--r-md); padding: 12px 14px; margin-top: 18px; font-size: .78rem; color: var(--text-soft); text-align: left; line-height: 1.8; }

  .board { display: none; }
  .board.on { display: block; }
  .layout { display: grid; grid-template-columns: 1fr 300px; gap: 22px; padding: 24px 0 60px; align-items: start; }
  @media (max-width: 940px) { .layout { grid-template-columns: 1fr; } }

  .queue-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); display: inline-block; margin-right: 6px; animation: blink 2s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.35} }

  .ocard { padding: 18px; margin-bottom: 14px; }
  .ocard.new { border-color: var(--wine-500); box-shadow: 0 0 0 3px rgba(174,49,96,.1); }
  .ohead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
  .onum { font-family: var(--ff-display); font-size: 1.15rem; font-weight: 700; color: var(--wine-700); }
  .ometa { font-size: .8rem; color: var(--text-soft); margin-top: 2px; }
  .waiting { font-size: .75rem; color: var(--text-faint); }

  .prep { background: var(--gray-50); border: 1px solid var(--border); border-radius: var(--r-md); padding: 12px 14px; margin-bottom: 10px; }
  .prep-name { font-weight: 600; font-size: .92rem; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .prep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 4px 14px; margin-top: 8px; }
  .prep-grid div { font-size: .82rem; color: var(--text-soft); display: flex; justify-content: space-between; gap: 8px; }
  .prep-grid div b { color: var(--text); font-variant-numeric: tabular-nums; font-weight: 600; }
  .prep-note { font-size: .8rem; color: var(--text-soft); margin-top: 8px; }

  .ctl-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .ctl-row .seg { flex: 1; min-width: 220px; }
  .eta-line { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  .eta-line .input { width: 78px; text-align: center; }
  .short-line { display: flex; gap: 8px; margin-top: 10px; }

  .inv-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .inv-item:last-child { border-bottom: none; }
  .inv-name { font-size: .84rem; }
  .inv-qty { font-size: .8rem; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 62px; text-align: right; }
  .inv-qty.low { color: var(--danger); }
  .inv-btns { display: flex; gap: 4px; }
  .inv-btns button { width: 25px; height: 25px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-size: .85rem; line-height: 1; }
  .inv-btns button:hover { background: var(--gray-100); }
  .inv-scroll { max-height: 62vh; overflow-y: auto; }
</style>
</head>
<body>

<!-- login -->
<div class="login-wrap" id="login">
  <div class="card login-card">
    <div class="login-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20h16M6 4h12l-1 8a5 5 0 0 1-10 0L6 4Z"/></svg>
    </div>
    <h2 style="font-size:1.25rem">Bar station</h2>
    <p class="muted" style="font-size:.86rem;margin:6px 0 20px">Sign in with the account your manager set up.</p>
    <div class="stack" style="text-align:left">
      <input id="bName" class="input" placeholder="Your name" autocomplete="username">
      <input id="bPass" class="input" type="password" placeholder="Passcode" autocomplete="current-password">
      <button class="btn btn-primary btn-block" id="loginBtn">Sign in</button>
    </div>
    <div class="demo-box" id="demoBox"></div>
  </div>
</div>

<!-- board -->
<div class="board" id="board">
  <div class="topbar topbar-dark">
    <div class="container topbar-inner">
      <div id="brandSlot"></div>
      <div class="row">
        <span style="font-size:.85rem;opacity:.8" id="whoName"></span>
        <button class="btn btn-sm" style="background:rgba(255,255,255,.12);color:#fff" onclick="signOut()">Sign out</button>
      </div>
    </div>
  </div>

  <div class="container layout">
    <div>
      <div class="queue-head">
        <h2 style="font-size:1.25rem"><span class="live-dot"></span>Live queue</h2>
        <span class="pill pill-gray" id="qCount">—</span>
      </div>
      <div id="queue"></div>
    </div>

    <div class="card card-pad">
      <div class="spread" style="margin-bottom:10px">
        <h3 style="font-size:1rem">Stock</h3>
        <span class="hint">tap ± to adjust</span>
      </div>
      <div class="inv-scroll" id="inv"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js"></script>
<script src="assets/data.js"></script>
<script src="assets/api.js"></script>
<script src="assets/character.js"></script>
<script src="assets/ui.js"></script>
<script>
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const C = KoraAPI.catalog;
  const money = KoraAPI.money;
  let seen = new Set();
  let timer = null;

  KoraAPI.ready().then(() => {
    $('demoBox').innerHTML = KoraAPI.mode === 'supabase'
      ? 'Connected to Supabase. Ask your manager for your name and passcode.'
      : '<b>Demo mode</b><br>Name: <b>Demo Barista</b><br>Passcode: <b>1234</b>';
    const s = KoraAPI.session();
    if (s && s.role === 'staff') enter(s.name);
  }).catch(e => KoraUI.toast(e.message, 'err'));

  $('loginBtn').onclick = async () => {
    const name = $('bName').value.trim(), pass = $('bPass').value;
    if (!name || !pass) { KoraUI.toast('Enter your name and passcode', 'err'); return; }
    $('loginBtn').disabled = true;
    try {
      const res = await KoraAPI.staffLogin(name, pass);
      if (!res.ok) { KoraUI.toast(res.error, 'err'); $('loginBtn').disabled = false; return; }
      enter(res.name);
    } catch (err) { KoraUI.toast(err.message, 'err'); $('loginBtn').disabled = false; }
  };

  window.signOut = async () => { await KoraAPI.logout(); location.reload(); };

  function enter(name) {
    $('login').style.display = 'none';
    $('board').classList.add('on');
    $('brandSlot').innerHTML = KoraUI.brandMark({ size: 26, tagline: false, onDark: true, color: '#fff' });
    $('whoName').textContent = name;
    refresh();
    clearInterval(timer);
    timer = setInterval(refresh, 3000);
    loadInv();
  }

  /* ------------------------------------------------- prep sheet ------- */
  const lbl = k => (C.labels[k] || {}).n || k;
  const unit = k => (C.labels[k] || {}).u || 'g';

  function prepFor(item) {
    // Build the exact quantities the bar needs to pull.
    const rows = {};
    if (item.kind === 'custom') {
      const k = item.kitchen || {};
      const L = item.labels || {};
      if (L.base) rows[L.base] = k.brew + ' ml';
      if (L.creamer && L.creamer !== 'No Creamer') rows[L.creamer] = k.creamer + ' ml';
      (L.flavor || []).forEach(f => { rows[f] = k.sweet + ' ml'; });
      if (k.ice) rows['Ice'] = k.ice + ' g';
      (k.toppings || []).forEach(t => { rows[t] = 'portion'; });
      return { rows, note: 'Cup: ' + (k.cup || '—') + (k.shaken ? ' · shaken' : '') };
    }
    const m = C.menu.find(x => x.id === item.menu_id);
    const size = C.sizes.find(s => s.key === item.size);
    const scale = size ? Number(size.scale || 1) : 1;
    Object.keys((m && m.recipe) || {}).forEach(k => {
      rows[lbl(k)] = Math.round((m.recipe[k] || 0) * scale) + ' ' + unit(k);
    });
    (item.toppings || []).forEach(k => {
      const t = C.toppings.find(x => x.key === k);
      if (t) rows[t.name] = Math.round(t.portion * scale) + ' ' + t.unit;
    });
    const milk = C.milkOptions.find(x => x.key === item.milk);
    const note = [
      size ? size.name : null,
      item.sugar + '% sugar',
      item.ice + '% ice',
      milk ? milk.name : null
    ].filter(Boolean).join(' · ');
    return { rows, note };
  }

  function typeChip(o) {
    if (o.order_type === 'table') return `<span class="pill pill-wine">Table ${o.table_number || '?'}</span>`;
    if (o.order_type === 'delivery') return `<span class="pill pill-amber">Delivery</span>`;
    return `<span class="pill pill-gray">Pickup</span>`;
  }
  const STATUSES = [['received', 'New'], ['preparing', 'Making'], ['ready', 'Ready'], ['completed', 'Handed over']];

  function waitedFor(o) {
    const mins = Math.floor((Date.now() - new Date(o.created_at).getTime()) / 60000);
    return mins < 1 ? 'just now' : mins + ' min ago';
  }

  async function refresh() {
    let orders;
    try { orders = await KoraAPI.staffOrders(); }
    catch (err) {
      if (String(err.message).includes('Session expired')) { KoraUI.toast('Session expired — sign in again', 'err'); await KoraAPI.logout(); setTimeout(() => location.reload(), 1200); }
      return;
    }
    $('qCount').textContent = orders.length + ' active';

    orders.forEach(o => {
      if (!seen.has(o.id)) {
        if (seen.size) KoraUI.toast('New order ' + o.order_number, 'ok');
        seen.add(o.id);
      }
    });

    if (!orders.length) {
      $('queue').innerHTML = '<div class="card empty"><div class="empty-icon">🧋</div>Nothing in the queue right now.</div>';
      return;
    }

    $('queue').innerHTML = orders.map(o => {
      const items = (o.items || []).map(it => {
        const p = prepFor(it);
        const rows = Object.keys(p.rows).map(k =>
          `<div><span>${k}</span><b>${p.rows[k]}</b></div>`).join('');
        return `<div class="prep">
            <div class="prep-name">${it.name}${(it.qty || 1) > 1 ? ' ×' + it.qty : ''}
              ${it.kind === 'custom' ? '<span class="pill pill-wine">New creation</span>' : ''}</div>
            <div class="prep-grid">${rows}</div>
            ${p.note ? `<div class="prep-note">${p.note}</div>` : ''}
          </div>`;
      }).join('');

      const invOpts = (window._inv || []).map(i =>
        `<option value="${i.name}">${i.name}</option>`).join('');

      return `<div class="card ocard ${o.status === 'received' ? 'new' : ''}">
        <div class="ohead">
          <div>
            <div class="onum">${o.order_number}</div>
            <div class="ometa">${o.customer_name}${o.customer_phone ? ' · ' + o.customer_phone : ''}</div>
            ${o.address ? `<div class="ometa">📍 ${o.address}${o.lat ? ` <a href="https://www.google.com/maps?q=${o.lat},${o.lng}" target="_blank" rel="noopener">map</a>` : ''}</div>` : ''}
            <div class="waiting">${waitedFor(o)}</div>
          </div>
          <div style="text-align:right">
            ${typeChip(o)}
            <div style="font-weight:700;margin-top:6px">${money(o.total_price)}</div>
          </div>
        </div>
        ${items}
        <div class="ctl-row">
          <div class="segment seg">
            ${STATUSES.map(([k, l]) =>
              `<button class="${o.status === k ? 'on' : ''}" onclick="setStatus('${o.id}','${k}')">${l}</button>`).join('')}
          </div>
        </div>
        <div class="eta-line">
          <span class="hint">Prep time</span>
          <input type="number" min="1" max="180" class="input" id="eta_${o.id}" value="${o.eta_minutes || ''}" placeholder="min">
          <button class="btn btn-ghost btn-sm" onclick="setEta('${o.id}')">Set</button>
          ${o.eta_minutes ? `<span class="hint">customer sees a ${o.eta_minutes} min countdown</span>` : ''}
        </div>
        <div class="short-line">
          <select class="select" id="sh_${o.id}">
            <option value="">Flag a missing ingredient…</option>${invOpts}
          </select>
          <button class="btn btn-ghost btn-sm" onclick="flagShort('${o.id}')">Flag</button>
        </div>
        ${o.shortage_flag ? `<div style="margin-top:8px"><span class="pill pill-red">Customer notified: ${o.shortage_flag}</span>
          <button class="btn btn-quiet btn-sm" onclick="clearShort('${o.id}')">clear</button></div>` : ''}
      </div>`;
    }).join('');
    // Only replay the entrance animation when the queue actually changes —
    // this view refreshes every 3s and re-animating each time would flicker.
    const sig = orders.map(o => o.id + o.status + o.eta_minutes + o.shortage_flag).join('|');
    if (sig !== lastSig) { KoraUI.stagger($('queue'), 55); lastSig = sig; }
  }
  let lastSig = '';

  window.setStatus = async (id, st) => {
    try { await KoraAPI.staffSetStatus(id, st); refresh(); }
    catch (e) { KoraUI.toast(e.message, 'err'); }
  };
  window.setEta = async (id) => {
    const v = Number($('eta_' + id).value);
    if (!v || v < 1) { KoraUI.toast('Enter the minutes first', 'err'); return; }
    try { await KoraAPI.staffSetEta(id, v); KoraUI.toast('Customer is now counting down', 'ok'); refresh(); }
    catch (e) { KoraUI.toast(e.message, 'err'); }
  };
  window.flagShort = async (id) => {
    const v = $('sh_' + id).value;
    if (!v) return;
    try { await KoraAPI.staffFlagShortage(id, v); refresh(); }
    catch (e) { KoraUI.toast(e.message, 'err'); }
  };
  window.clearShort = async (id) => {
    try { await KoraAPI.staffFlagShortage(id, ''); refresh(); }
    catch (e) { KoraUI.toast(e.message, 'err'); }
  };

  /* -------------------------------------------------- inventory ------- */
  async function loadInv() {
    try {
      const inv = await KoraAPI.staffInventory();
      window._inv = inv;
      $('inv').innerHTML = inv.map(i => `
        <div class="inv-item">
          <span class="inv-name">${i.name}</span>
          <div class="row" style="gap:8px">
            <span class="inv-qty ${Number(i.qty) <= Number(i.low_threshold) ? 'low' : ''}">${Math.round(i.qty)} ${i.unit}</span>
            <div class="inv-btns">
              <button onclick="adjInv('${i.key}',-100)">−</button>
              <button onclick="adjInv('${i.key}',100)">+</button>
            </div>
          </div>
        </div>`).join('');
    } catch (e) { $('inv').innerHTML = '<p class="hint">Could not load stock.</p>'; }
  }
  window.adjInv = async (key, d) => {
    try { await KoraAPI.staffAdjustInventory(key, d); loadInv(); }
    catch (e) { KoraUI.toast(e.message, 'err'); }
  };
})();
</script>
</body>
</html>
