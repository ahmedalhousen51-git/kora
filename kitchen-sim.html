<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Kitchen — Kora</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<link rel="stylesheet" href="assets/scene3d.css">
<style>
  /* ==========================================================================
     The kitchen is a room you stand in, not a picture with a form under it.
     Pastel toy-kitchen palette; every control lives inside the scene.
     ========================================================================== */
  body { overflow-x: hidden; }

  :root {
    --k-pink: #F4B6C6;  --k-pink-d: #E0879F;  --k-pink-l: #FBDDE4;
    --k-mint: #A9DED6;  --k-mint-d: #79C3B8;  --k-mint-l: #D6F0EC;
    --k-cream:#FBF3E6;  --k-wood:  #E9C89B;   --k-wood-d: #C79E68;
    --k-white:#FDFBF9;  --k-line:  #E2D3C6;
  }

  .k-top { background: linear-gradient(120deg, var(--gray-950), var(--wine-900)); color: #fff; padding: 12px 0; }
  .k-top .container { display: flex; align-items: center; justify-content: space-between; }
  .k-mode { font-size: .68rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--wine-300); }

  .progress { display: flex; gap: 4px; max-width: 900px; margin: 12px auto 0; padding: 0 20px; }
  .progress i { flex: 1; height: 5px; border-radius: 3px; background: rgba(255,255,255,.22); transition: background .3s; }
  .progress i.done { background: var(--k-pink); }
  .progress i.now  { background: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,.22); }

  /* ================= THE ROOM ================= */
  .panel, .k-top .container, .progress { direction: rtl; }
  .kitchen {
    position: relative; max-width: 1060px; margin: 14px auto 0; height: 560px;
    border-radius: var(--r-xl); overflow: hidden;
    box-shadow: var(--sh-3); touch-action: none; user-select: none;
    perspective: 900px; perspective-origin: 50% 44%;
    background: var(--k-cream);
  }
  /* the side walls close the box in */
  .side {
    position: absolute; top: 0; bottom: 0; width: 120px; transform-style: preserve-3d;
    background: linear-gradient(90deg, rgba(120,80,60,.20), rgba(120,80,60,0));
    pointer-events: none;
  }
  .side.l { left: 0; transform: rotateY(38deg); transform-origin: left center; }
  .side.r { right: 0; transform: rotateY(-38deg); transform-origin: right center;
    background: linear-gradient(270deg, rgba(120,80,60,.20), rgba(120,80,60,0)); }
  .kitchen-3d { position: absolute; inset: 0; transform-style: preserve-3d;
    transition: transform .3s cubic-bezier(.2,.8,.3,1); will-change: transform; }

  /* ---- wall: soft wallpaper stripes, like a kid's kitchen corner ---- */
  .wall {
    position: absolute; left: 0; right: 0; top: 0; height: 372px; transform-style: preserve-3d;
    transform: translateZ(-130px) scale(1.16);
    background:
      repeating-linear-gradient(90deg, rgba(228,150,175,.09) 0 12px, transparent 12px 46px),
      linear-gradient(180deg, #FFF9F2, #F6E9DE);
  }

  /* ---- upper cabinets + open shelf + clock ---- */
  .cabinets { position: absolute; left: 3%; right: 3%; top: 10px; height: 132px; display: flex; gap: 10px; }
  .cab {
    background: linear-gradient(180deg, var(--k-white), #F1E7DE);
    border: 2px solid var(--k-line); border-radius: 12px; position: relative;
    box-shadow: 0 4px 0 rgba(0,0,0,.05);
  }
  .cab.door { flex: 0 0 148px; }
  .cab.door::after { content: ''; position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    width: 34px; height: 6px; border-radius: 4px; background: var(--k-mint-d); }
  .cab.door.pink::after { background: var(--k-pink-d); }
  .cab.open { flex: 1; background: linear-gradient(180deg, #F3E7DB, #E9DACB); display: flex;
    align-items: flex-end; justify-content: center; gap: 12px; padding: 0 16px 12px; }
  .cab.open .jar { width: 20px; border-radius: 4px 4px 3px 3px; position: relative; }
  .cab.open .jar::before { content: ''; position: absolute; top: -5px; left: -2px; right: -2px;
    height: 6px; border-radius: 3px; background: #C9B7A6; }
  .clock { flex: 0 0 96px; border-radius: 50%; background: var(--k-white);
    border: 4px solid var(--k-pink); align-self: center; height: 96px; position: relative; }
  .clock::before, .clock::after { content: ''; position: absolute; left: 50%; top: 50%;
    background: var(--k-pink-d); border-radius: 2px; transform-origin: 0 50%; }
  .clock::before { width: 26px; height: 4px; transform: translate(0,-50%) rotate(-58deg); }
  .clock::after  { width: 34px; height: 3px; transform: translate(0,-50%) rotate(24deg); }

  /* ---- rail of hanging utensils ---- */
  .hangrail { position: absolute; left: 8%; right: 8%; top: 152px; height: 62px; }
  .hangrail .bar-h { position: absolute; top: 0; left: 0; right: 0; height: 6px; border-radius: 3px;
    background: linear-gradient(180deg, #C9B7A6, #A89583); }
  .hangrail .hook { position: absolute; top: 6px; width: 30px; text-align: center; }
  .hangrail .hook i { display: block; width: 2px; height: 10px; margin: 0 auto; background: #A89583; }
  .hangrail .hook u { display: block; width: 26px; height: 34px; margin: 0 auto; border-radius: 6px 6px 12px 12px;
    text-decoration: none; }

  /* the shelf class is kept: the machines rail still hangs off the wall */
  .shelf { display: none; }
  .rail { position: absolute; left: 43%; top: 196px; width: 130px; height: 140px; transform-style: preserve-3d; }
  .rail .machine { position: absolute; top: 0; width: 130px; height: 140px;
    transition: transform .5s cubic-bezier(.3,.9,.35,1), opacity .4s ease;
    opacity: .28; transform-origin: 65px 130px; transform-style: preserve-3d; }
  .rail .machine svg { width: 100%; height: 100%; display: block; }
  .rail .machine.on { opacity: .95; }

  .splash { position: absolute; left: 0; right: 0; bottom: 0; height: 104px;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.55) 0 2px, transparent 2px 44px),
      repeating-linear-gradient(0deg,  rgba(255,255,255,.55) 0 2px, transparent 2px 44px),
      linear-gradient(180deg, #FBEDE4, #F3DDD0);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.7); pointer-events: none; }

  /* --- things that move on their own, so the room is never dead --- */
  .steam { position: absolute; z-index: 2; pointer-events: none; }
  .steam i {
    position: absolute; bottom: 0; width: 10px; height: 10px; border-radius: 50%;
    background: rgba(255,255,255,.72); filter: blur(3px);
    animation: steam-up 3.4s ease-out infinite;
  }
  @keyframes steam-up {
    0%   { transform: translate(0,0) scale(.5); opacity: 0; }
    18%  { opacity: .85; }
    100% { transform: translate(var(--sx,10px), -74px) scale(2.1); opacity: 0; }
  }
  .hangrail .hook u { animation: sway 3.6s ease-in-out infinite; transform-origin: 50% 0;
    animation-delay: var(--d, 0s); }
  @keyframes sway { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  .clock::after { animation: tick 12s steps(12) infinite; }
  @keyframes tick { to { transform: translate(0,-50%) rotate(384deg); } }
  .cab.open .jar { animation: jar-breathe 4.4s ease-in-out infinite; animation-delay: var(--d,0s);
    transform-origin: 50% 100%; }
  @keyframes jar-breathe { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(1.04); } }
  .ing { animation: ing-bob 3.8s ease-in-out infinite; animation-delay: var(--d,0s); }
  @keyframes ing-bob { 0%,100% { translate: 0 0; } 50% { translate: 0 -3px; } }
  .ing.on { animation: none; }
  /* a slow shimmer sliding across the worktop */
  .counter .top::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.5) 45%, transparent 60%);
    background-size: 260% 100%; animation: sheen 7s linear infinite;
  }
  @keyframes sheen { to { background-position: -260% 0; } }

  .spot { position: absolute; left: 50%; top: 60px; width: 460px; height: 400px; margin-left: -230px;
    background: radial-gradient(circle, rgba(255,236,190,.55), rgba(255,236,190,0) 64%); pointer-events: none; z-index: 1; }

  /* ---- the counter ---- */
  .counter { position: absolute; left: 0; right: 0; top: 372px; bottom: 0; z-index: 3;
    transform-style: preserve-3d; transform: translateZ(40px);
    background: linear-gradient(180deg, var(--k-pink), #E79FB4 40%, #DB8AA3); }
  .counter .top { position: absolute; top: -40px; left: -4%; width: 108%; height: 74px;
    transform: rotateX(64deg); transform-origin: bottom center;
    background: linear-gradient(180deg, #F7E3C6, var(--k-wood));
    box-shadow: 0 14px 22px rgba(90,60,40,.22); }
  .counter .lip { position: absolute; top: 32px; left: 0; right: 0; height: 14px;
    background: linear-gradient(180deg, #E6C395, var(--k-wood-d));
    border-radius: 0 0 4px 4px; box-shadow: 0 4px 8px rgba(90,60,40,.28); }
  .counter .grain { position: absolute; top: 41px; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(90deg, rgba(255,255,255,.16) 0 2px, transparent 2px 132px); }
  /* cabinet doors + knobs along the front of the counter */
  .counter .doors { position: absolute; top: 56px; left: 3%; right: 3%; bottom: 96px;
    display: flex; gap: 14px; }
  .counter .doors span { flex: 1; border-radius: 10px; background: rgba(255,255,255,.18);
    border: 2px solid rgba(255,255,255,.28); position: relative; }
  .counter .doors span::after { content: ''; position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    width: 30px; height: 6px; border-radius: 4px; background: var(--k-mint); }

  /* ---- the ingredient bench: everything you cook with, visible at once ---- */
  .bench { position: absolute; left: 0; right: 0; bottom: 40px; height: 76px; z-index: 7;
    display: flex; justify-content: center; align-items: flex-end; gap: clamp(8px, 1.8vw, 26px);
    pointer-events: none; transform: translateZ(56px); transform-style: preserve-3d; }
  /* a ledge so the bowls read as placed on something */
  .bench::before { content: ''; position: absolute; left: 6%; right: 6%; bottom: -8px; height: 8px;
    border-radius: 5px; background: rgba(255,255,255,.32); box-shadow: 0 3px 6px rgba(90,60,40,.18); }
  .ing { width: 64px; text-align: center; opacity: .62; transform: scale(.92);
    transition: opacity .3s ease, transform .3s cubic-bezier(.2,.9,.3,1.4); }
  .ing.on { opacity: 1; transform: scale(1.12) translateY(-6px); }
  .ing .bowl {
    width: 56px; height: 38px; margin: 0 auto 5px; position: relative;
    border-radius: 6px 6px 26px 26px;
    background: linear-gradient(180deg, #FFFFFF, #F2E9E0);
    border: 2.5px solid #B79C86; overflow: hidden;
    box-shadow: 0 4px 8px rgba(90,60,40,.22);
  }
  .ing .bowl b { position: absolute; left: 3px; right: 3px; bottom: 3px; height: 24px;
    border-radius: 4px 4px 20px 20px; background: var(--c); display: block;
    box-shadow: inset 0 3px 5px rgba(0,0,0,.16); }
  .ing .bowl::after { content: ''; position: absolute; top: 4px; left: 6px; width: 14px; height: 5px;
    border-radius: 50%; background: rgba(255,255,255,.6); }
  .ing.jar-shape .bowl { height: 50px; border-radius: 5px 5px 9px 9px; }
  .ing .nm { font-size: .66rem; font-weight: 700; color: #6B4C38; direction: rtl;
    background: #FFF; border-radius: 999px; padding: 2px 8px; display: inline-block;
    box-shadow: 0 2px 4px rgba(90,60,40,.18); }
  .ing.on .nm { background: var(--k-pink-d); color: #fff; }

  .chef { position: absolute; left: 34px; bottom: 152px; width: 136px; z-index: 2; pointer-events: none; }
  .chef svg { width: 100%; height: auto; display: block; }
  /* he breathes when idle and bounces when he is working */
  .chef { animation: chef-idle 4.2s ease-in-out infinite; }
  @keyframes chef-idle {
    0%,100% { transform: translateY(0) rotate(0deg); }
    50%     { transform: translateY(-3px) rotate(-.8deg); }
  }
  .chef.busy { animation: chef-work .7s ease-in-out infinite; }
  @keyframes chef-work { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
  /* the head turns toward whatever you are holding */
  .chef .c-head { transition: transform .28s cubic-bezier(.3,.9,.4,1.3); transform-origin: 60px 84px; }
  .chef .c-eyes { animation: chef-blink 5.4s infinite; transform-origin: 60px 51px; }
  @keyframes chef-blink {
    0%,92%,100% { transform: scaleY(1); }
    95%         { transform: scaleY(.08); }
  }
  .chef .c-arm { transform-origin: 90px 122px; }
  .chef.busy .c-arm { animation: chef-stir .5s ease-in-out infinite; }
  @keyframes chef-stir { 0%,100%{transform:rotate(0)} 50%{transform:rotate(-14deg)} }

  .chef-bubble {
    position: absolute; left: 18px; bottom: 262px; max-width: 220px; z-index: 12;
    background: var(--gray-900); color: #fff; padding: 10px 14px;
    border-radius: 14px 14px 14px 4px; font-size: .84rem; line-height: 1.55;
    font-weight: 500; direction: rtl; text-align: right; box-shadow: var(--sh-3);
    opacity: 0; transform: translateY(8px) scale(.92);
    transition: all .22s cubic-bezier(.2,.9,.3,1.3); pointer-events: none;
  }
  .chef-bubble.on { opacity: 1; transform: translateY(0) scale(1); }
  .chef-bubble::after { content: ''; position: absolute; left: 18px; bottom: -6px;
    width: 12px; height: 12px; background: var(--gray-900); transform: rotate(45deg); border-radius: 2px; }

  /* ---- the cup you are filling ---- */
  .cup-stage { position: absolute; left: 50%; margin-left: -58px; bottom: 156px;
    width: 116px; height: 156px; z-index: 6; transform-style: preserve-3d;
    transform: translateZ(50px); }
  .cup-stage.grabbable { cursor: grab; }
  .cup-stage.grabbing { cursor: grabbing; }
  .cup-stage.wobble { animation: wob3d .45s ease-in-out; }
  @keyframes wob3d {
    0%,100% { transform: translateZ(50px) rotateZ(0) rotateY(0); }
    30%     { transform: translateZ(50px) rotateZ(-4deg) rotateY(-9deg); }
    70%     { transform: translateZ(50px) rotateZ(4deg) rotateY(9deg); }
  }

  /* ---- the tool you pick up ---- */
  .tool {
    position: absolute; z-index: 8; cursor: grab; touch-action: none;
    left: 214px; bottom: 168px; transform-style: preserve-3d;
    filter: drop-shadow(0 10px 16px rgba(90,60,40,.32));
    transition: transform .3s cubic-bezier(.3,.9,.4,1.3), filter .2s ease;
    transform: translateZ(40px) rotateY(-10deg);
  }
  .tool.held { filter: drop-shadow(0 26px 30px rgba(90,60,40,.45)); }
  .tool.homing { transition: transform .3s ease, left .32s ease, top .32s ease; }
  .tool svg { width: 100%; height: auto; display: block; pointer-events: none; }
  .tool.held { cursor: grabbing; transition: transform .12s ease; z-index: 11; }
  .tool-hint {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: -24px;
    background: var(--wine-700); color: #fff; padding: 3px 11px; border-radius: 999px;
    font-size: .68rem; font-weight: 700; white-space: nowrap; direction: rtl;
    animation: hint-bob 1.4s ease-in-out infinite;
  }
  @keyframes hint-bob { 0%,100%{transform:translateX(-50%) translateY(0)} 50%{transform:translateX(-50%) translateY(-4px)} }
  .tool.held .tool-hint { display: none; }

  .zone {
    position: absolute; z-index: 5; border: 3px dashed rgba(224,135,159,.75);
    border-radius: 20px; opacity: 0; transition: opacity .25s ease, background .2s ease;
    pointer-events: none;
  }
  .zone.show { opacity: 1; }
  .zone.hot { background: rgba(224,135,159,.2); border-color: var(--k-pink-d); }

  .stream { position: absolute; width: 13px; border-radius: 0 0 7px 7px; z-index: 6;
            opacity: 0; transition: opacity .1s ease; pointer-events: none; }
  .stream.on { opacity: 1; }
  .stream::after { content: ''; position: absolute; bottom: -5px; left: -3px; width: 19px; height: 14px;
    border-radius: 50%; background: inherit; animation: splat .36s ease-in-out infinite; }
  @keyframes splat { 0%,100%{transform:scale(1)} 50%{transform:scale(1.3,.75)} }

  .lump { position: absolute; z-index: 6; pointer-events: none; }
  .lump span { position: absolute; animation: fall .5s cubic-bezier(.5,0,.9,.3) forwards; }
  @keyframes fall { from{transform:translateY(0) rotate(0);opacity:1} to{transform:translateY(80px) rotate(200deg);opacity:0} }

  .burst { position: absolute; left: 50%; bottom: 236px; z-index: 10; pointer-events: none; }
  .burst span { position: absolute; width: 9px; height: 9px; border-radius: 50%; background: #FFD75E;
                animation: spark .7s ease-out forwards; }
  @keyframes spark { from{transform:translate(0,0) scale(1);opacity:1} to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0} }
  .perfect { position: absolute; left: 50%; bottom: 268px; transform: translateX(-50%) scale(.6);
    font-family: var(--ff-display); font-weight: 800; font-size: 1.6rem; color: #FFD75E;
    text-shadow: 0 2px 0 #B8860B, 0 6px 14px rgba(0,0,0,.35); opacity: 0; z-index: 11;
    pointer-events: none; white-space: nowrap; }
  .perfect.go { animation: perfect-pop 1.1s cubic-bezier(.2,.9,.3,1.4) forwards; }
  @keyframes perfect-pop {
    0%{opacity:0;transform:translateX(-50%) scale(.5) translateY(10px)}
    25%{opacity:1;transform:translateX(-50%) scale(1.15) translateY(-6px)}
    60%{opacity:1;transform:translateX(-50%) scale(1) translateY(-14px)}
    100%{opacity:0;transform:translateX(-50%) scale(.95) translateY(-30px)}
  }

  .cup-choice { position: absolute; z-index: 6; cursor: pointer; text-align: center; }
  .cup-choice .cc-art { background: linear-gradient(180deg,#FFFDFB,#EFE3DA); border: 2.5px solid var(--k-line);
    border-radius: 4px 4px 16px 16px; margin: 0 auto 6px; transition: transform .18s ease; }
  .cup-choice:hover .cc-art { transform: translateY(-6px) scale(1.04); }
  .cup-choice.on .cc-art { border-color: var(--k-pink-d); box-shadow: 0 0 0 4px rgba(224,135,159,.28); }
  .cup-choice .cc-label { font-size: .7rem; font-weight: 700; color: #7A5C46;
    background: rgba(255,255,255,.9); padding: 2px 8px; border-radius: 999px; }

  /* ================= the controls, pinned inside the room ================= */
  .panel {
    position: absolute; z-index: 14; right: 18px; top: 18px; width: 268px;
    background: rgba(253,251,249,.94); backdrop-filter: blur(8px);
    border: 2px solid var(--k-line); border-radius: var(--r-lg);
    padding: 16px 18px 18px; box-shadow: 0 18px 40px rgba(90,60,40,.28);
    text-align: center; color: var(--text);
  }
  /* a little tape tab, so it reads as a recipe card stuck to the wall */
  .panel::before { content: ''; position: absolute; top: -11px; left: 50%; transform: translateX(-50%) rotate(-3deg);
    width: 64px; height: 20px; border-radius: 3px; background: rgba(169,222,214,.85);
    box-shadow: 0 2px 4px rgba(0,0,0,.08); }
  .panel h2 { font-size: 1.02rem; margin-bottom: 3px; }
  .panel .hint-txt { color: var(--text-soft); font-size: .78rem; margin: 0 0 12px; }
  .readout { font-family: var(--ff-display); font-size: 1.9rem; font-weight: 700; line-height: 1.1; }
  .readout small { font-size: .85rem; font-weight: 500; color: var(--text-faint); margin-left: 4px; }
  .target { font-size: .72rem; color: var(--text-faint); margin-top: 2px; }
  .target.good { color: var(--success); font-weight: 600; }
  .gauge { height: 9px; border-radius: 5px; background: #E7DACE; margin: 12px 0 4px;
           position: relative; overflow: hidden; }
  .gauge .zone-bar { position: absolute; top: 0; bottom: 0; left: 30%; width: 40%; background: rgba(31,122,77,.24); }
  .gauge .bar { position: absolute; top: 0; bottom: 0; left: 0; width: 0; background: var(--k-pink-d);
                border-radius: 5px; transition: width .1s linear; }
  .shake-meter .bar { background: linear-gradient(90deg, var(--k-pink-d), #FFD75E); }

  .acts { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .acts .btn { width: 100%; padding: 10px 14px; font-size: .88rem; }
  .lock-note { font-size: .68rem; color: var(--text-faint); margin-top: 9px; line-height: 1.5; }
  .recap { text-align: right; background: #F6EEE5; border: 1px solid var(--k-line);
    border-radius: var(--r-md); padding: 11px 13px; margin-bottom: 10px; font-size: .76rem; line-height: 1.75; }
  .recap b { color: var(--text); } .recap span { color: var(--text-soft); }

  .style-row { display: flex; gap: 7px; justify-content: center; flex-wrap: wrap; }
  .style-pick {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    min-width: 60px; padding: 9px 8px; cursor: pointer; font-family: inherit;
    font-size: .75rem; font-weight: 600; color: var(--text);
    border: 2px solid var(--k-line); border-radius: var(--r-md);
    background: var(--k-white); transition: all .16s ease;
  }
  .style-pick .sp-ic { font-size: 1.3rem; }
  .style-pick:hover { transform: translateY(-3px); border-color: var(--k-pink); }
  .style-pick.on { background: var(--k-pink-d); border-color: var(--k-pink-d); color: #fff; }

  /* Dragging is the fun way; these are the accurate way. Numbers stay LTR so
     "-20 -5 +5 +20" reads in the order you expect inside the RTL card. */
  .fine-row { direction: ltr; display: flex; gap: 6px; justify-content: center; margin-top: 10px; }
  .mini-btn {
    flex: 1; padding: 7px 0; font-family: inherit; font-size: .8rem; font-weight: 700;
    border: 2px solid var(--k-line); border-radius: 10px; background: var(--k-white);
    color: var(--text); cursor: pointer; transition: all .14s ease;
  }
  .mini-btn:hover { background: var(--k-mint-l); border-color: var(--k-mint-d); transform: translateY(-2px); }
  .mini-btn:active { transform: translateY(1px); }
  .preset-row { display: flex; gap: 6px; justify-content: center; margin-top: 7px; }
  .preset-btn {
    flex: 1; padding: 7px 0; font-family: inherit; font-size: .76rem; font-weight: 700;
    border: 2px solid var(--k-line); border-radius: 10px; background: var(--k-white);
    color: var(--text-soft); cursor: pointer; transition: all .14s ease; direction: rtl;
  }
  .preset-btn:hover { background: var(--k-pink-l); border-color: var(--k-pink); color: var(--text); }
  .preset-btn.on { background: var(--k-pink-d); border-color: var(--k-pink-d); color: #fff; }
  .step-reset {
    margin-top: 8px; width: 100%; padding: 6px 0; background: none; border: none;
    font-family: inherit; font-size: .72rem; font-weight: 600; color: var(--text-faint);
    cursor: pointer; text-decoration: underline; direction: rtl;
  }
  .step-reset:hover { color: var(--danger); }

  .scoop-row { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 10px; }
  .scoop-btn {
    width: 40px; height: 40px; border-radius: 13px; border: 2px solid var(--k-line);
    background: var(--k-white); font-size: 1.3rem; cursor: pointer; color: var(--text);
    box-shadow: var(--sh-1); font-family: inherit;
  }
  .scoop-btn:hover { background: var(--k-cream); }
  .scoop-dots { display: flex; gap: 6px; }
  .scoop-dots i {
    width: 18px; height: 18px; border-radius: 50%;
    background: #EADDD1; border: 2px solid var(--k-line);
    transition: all .2s cubic-bezier(.2,.9,.3,1.5);
  }
  .scoop-dots i.on {
    background: radial-gradient(circle at 34% 30%, #F3E3CB, #C9A97C);
    border-color: #B08F62; transform: scale(1.12);
  }

  .sfx-toggle {
    background: rgba(255,255,255,.14); color: #fff; border: none;
    padding: 6px 10px; font-size: 1rem; line-height: 1; margin-inline-start: 10px;
  }
  .sfx-toggle:hover { background: rgba(255,255,255,.24); }

  /* ---- narrow screens: the room shrinks and the card drops underneath ---- */
  @media (max-width: 900px) {
    /* the card is a child of the room now, so on narrow screens the room
       itself has to stop being the full box and let the card sit under it */
    .kitchen { height: auto; overflow: visible; border-radius: 0; margin-top: 0; }
    .kitchen-3d { position: relative; height: 470px; overflow: hidden; }
    .wall { height: 300px; }
    .cabinets { height: 96px; }
    .cab.door { flex: 0 0 92px; }
    .clock { flex: 0 0 64px; height: 64px; }
    .hangrail { top: 112px; }
    .splash { height: 78px; }
    .rail { top: 150px; }
    .counter { top: 300px; }
    .bench { bottom: 12px; height: 62px; gap: 10px; }
    .ing { width: 46px; }
    .ing .bowl { width: 40px; height: 27px; }
    .chef { width: 92px; left: 8px; bottom: 126px; }
    .chef-bubble { max-width: 170px; font-size: .78rem; bottom: 208px; left: 10px; }
    .cup-stage { bottom: 128px; }
    .tool { left: 150px; bottom: 138px; }
    .panel {
      position: static; width: auto; max-width: 620px; margin: 0 auto;
      border-radius: 0 0 var(--r-xl) var(--r-xl); border-width: 0;
      backdrop-filter: none; background: var(--k-white);
    }
    .panel::before { display: none; }
    /* the buttons inherit width:100% from the sidebar layout — in a row that
       overflows the screen, so hand them back to flex */
    .acts { flex-direction: row; }
    .acts .btn { width: auto; flex: 1 1 0; min-width: 0; }
    .bench { gap: 6px; padding: 0 6px; }
    .ing { width: 42px; }
    .ing .bowl { width: 36px; height: 25px; }
    .ing .nm { font-size: .6rem; padding: 1px 5px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>

</div>

<div class="progress" id="prog"></div>

<div class="kitchen" id="kitchen">
 <div class="kitchen-3d" id="kitchen3d">
  <div class="wall">

<script>
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const C = KoraAPI.catalog;
  const M = KoraKitchen.machines;
  const T = KoraTools;

  let spec = null;
  try { spec = JSON.parse(localStorage.getItem('kora_kitchen_spec') || 'null'); } catch (e) {}
  if (!spec) { location.replace('guest.html'); return; }

  const OPTIONAL = spec.mode === 'optional';
  const ST = C.stations || [];
  let idx = 0;

  const V = { style: 'آيس', cup: 'عادي 500 مل', scoops: 1, brew: 0, creamer: 0, sweet: 0, ice: 0,
              toppings: [], shakes: 0, shaken: false, sealed: false, name: spec.customer || '' };

  $('brandSlot').innerHTML = KoraUI.brandMark({ size: 26, tagline: false, onDark: true, color: '#fff' });
  $('modeTag').textContent = OPTIONAL ? 'وضع اللعب · تقدر تتخطى' : 'كل خطوة ليها حساب';

  /* ---------------- the barista does the talking ---------------- */
  $('chef').innerHTML = KoraChar.chef({ mouth: 'smile' });
  const chefFace = o => { $('chef').querySelector('.c-head').innerHTML = KoraChar.face(o); };

  let bubbleT;
  function say(text, ms, mood) {
    const b = $('chefBubble');
    b.textContent = text;
    b.classList.add('on');
    if (mood === 'shock') chefFace({ mouth: 'oh' });
    else if (mood) chefFace({ mouth: 'grin', eyes: 'happy' });
    clearTimeout(bubbleT);
    bubbleT = setTimeout(() => { b.classList.remove('on'); chefFace({ mouth: 'smile' }); }, ms || 4200);
  }
  KoraUI.mascot.say = say;   // shared mascot lines come out of his mouth in here

  /* Egyptian coaching, one line per station */
  const GUIDE = {
    style:    'الأول قوللي، ده هيبقى آيس ولا سموزي ولا ميلك شيك؟',
    cup:      'اختار الكوباية — كبيرة ولا عادية؟',
    brew:     'امسك الكتلة واقلبها فوق الكوباية.. براحة على إيدك!',
    creamer:  'دلوقتي اللبن. صبّه بالراحة عشان الشكل يطلع حلو',
    sweet:    'شيل المضخة فوق الكوباية ودوس عليها.. كل ضغطة شوية سيرب',
    scoops:   'كام سكوب يا معلم؟ خد بالك، كل سكوب بيتقّلها',
    toppings: 'اغرف البوبا بالمغرفة واقلبها فوق الكوباية',
    ice:      'التلج آخر حاجة.. متغرقهاش يا معلم',
    shake:    'امسك الكوباية نفسها ورجّها يمين وشمال!',
    seal:     'حط الغطا على الكوباية واقفلها، وخلاص كده'
  };

  const NAG = {
    much:   ['بس بقى! كده كتير أوي 😅', 'ياعم وقّف، هتطفح!', 'الكوباية بتقولك خلاص 🙈'],
    little: ['ده رشة يا معلم، زوّد شوية', 'كده مش هتحس بيه خالص'],
    nice:   ['جامد! كده مظبوط', 'إيدك حلوة والله 👌', 'كده تمام يا وحش']
  };

  /* --------------------------------------------------------------------
     The barista actually watches what you are doing and comments on it.
     -------------------------------------------------------------------- */
  const SMART = {
    tooMuchBoba: [
      'يا عم إنت هتخلّصنا من البوبة ولا إيه؟! 😅',
      'البوبا دي كلها؟ ده مشروب مش طبق كشري',
      'خفف بوبا شوية، الشاليموه مش هيقدر عليها'
    ],
    longShake: [
      'ارحم الخلاط يا فنان.. هتتحرق الموتور! 🔥',
      'كفاية رج بقى، المشروب دايخ',
      'لو رجيتها أكتر هتطلع زبدة'
    ],
    weirdMix: [
      'إنت متأكد من العجن ده؟ على ضمانتك! 🤨',
      'التركيبة دي غريبة.. بس ماشي، إنت الزبون',
      'أنا هعملها بس متقولش محدش قالك'
    ],
    tooMuchIce: [
      'تلج كتير أوي! هتشرب مشروب ولا هتعمل مقلب؟',
      'كده هتشرب مية بعد ما يسيح'
    ],
    idle: [
      'واقف ليه؟ الكوباية مستنية',
      'خد وقتك.. بس مش أوي كده 😄',
      'محتاج مساعدة ولا نكمل؟'
    ],
    heavy: [
      'المشروب بقى تقيل.. سكوبات كتير',
      'كده هتاكل مش هتشرب 😄'
    ]
  };
  const pick = a => a[Math.floor(Math.random() * a.length)];

  /* Flavour pairs that genuinely fight each other. */
  function isWeirdMix() {
    const f = (spec.selections && spec.selections.flavor) || [];
    const base = (spec.selections && spec.selections.base) || '';
    const clash =
      (f.includes('matcha') && (f.includes('strawberry_puree') || f.includes('mango_puree'))) ||
      (base === 'espresso' && (f.includes('strawberry_puree') || f.includes('lychee_syrup'))) ||
      (base === 'thai_tea' && f.includes('matcha')) ||
      f.length >= 3;
    return clash;
  }

  let saidWeird = false;
  function maybeWeirdMix() {
    if (saidWeird || !isWeirdMix()) return;
    saidWeird = true;
    setTimeout(() => { say(pick(SMART.weirdMix), 5000, 'shock'); KoraSFX.ohNo(); }, 900);
  }

  /* Nudge the customer if they just stand there. */
  let idleT;
  function touchIdle() {
    clearTimeout(idleT);
    idleT = setTimeout(() => say(pick(SMART.idle), 4000), 14000);
  }
  ['pointerdown', 'pointermove'].forEach(ev =>
    document.addEventListener(ev, touchIdle, { passive: true }));

  /* ---------------- the cup (CSS 3D cylinder) ---------------- */
  $('cupStage').innerHTML = Kora3D.cup({ w: 116, h: 156, fill: 0 });
  const cupEl = $('cupStage');
  const cup3d = cupEl.querySelector('.cup3d');
  const capacity = () => (V.cup.indexOf('كبير') === 0 ? 600 : 480);

  function paintCup() {
    const cap = capacity();
    Kora3D.setCup(cup3d, {
      layers: [
        { amount: Math.min(1, V.sweet / cap),   color: '#7A3F14' },
        { amount: Math.min(1, V.brew / cap),    color: '#B4763C' },
        { amount: Math.min(1, V.creamer / cap), color: '#F3E3CB' }
      ],
      ice: Math.min(1, V.ice / 220),
      pearls: Math.min(12, V.toppings.length * 3),
      sealed: V.sealed
    });
  }

  /* The barista watches your hands: his head turns toward the pointer while
     you are dragging something over the counter, and re-centres when you let
     go. Pure decoration, but it is what stops him looking like a sticker. */
  const chefBox = () => $('chef').getBoundingClientRect();
  let headTimer = 0, headTarget = 0, headNow = 0;
  function lookAt(clientX) {
    const c = chefBox();
    const dx = clientX - (c.left + c.width / 2);
    headTarget = Math.max(-16, Math.min(16, dx / 26));
    startHead();
  }
  function lookAhead() { headTarget = 0; startHead(); }
  // A timer, not requestAnimationFrame: rAF is parked whenever the page is not
  // painting, which would leave his head stuck mid-turn (same reason the pour
  // uses an interval).
  function startHead() {
    if (headTimer) return;
    headTimer = setInterval(() => {
      headNow += (headTarget - headNow) * .2;
      const h = $('chef').querySelector('.c-head');
      if (h) h.style.transform = 'rotate(' + headNow.toFixed(2) + 'deg) translateX(' + (headNow * .5).toFixed(2) + 'px)';
      if (Math.abs(headTarget - headNow) < .12) { clearInterval(headTimer); headTimer = 0; }
    }, 30);
  }

  /* ---------------- the ingredient bench ----------------
     Ref: the cooking games lay every ingredient out in bowls so you can see
     what you are working with. The bowl for the current station lifts and
     brightens, so the room itself tells you what step you are on. */
  const ING = [
    { key: 'brew',     nm: 'شاي',  c: '#B4763C', jar: true },
    { key: 'creamer',  nm: 'لبن',  c: '#F6EFE2' },
    { key: 'sweet',    nm: 'سيرب', c: '#C4762A', jar: true },
    { key: 'scoops',   nm: 'سكوب', c: '#E8D6B8' },
    { key: 'toppings', nm: 'بوبا', c: '#3B2318' },
    { key: 'ice',      nm: 'تلج',  c: '#CFE7F5' }
  ];
  $('bench').innerHTML = ING.map(g =>
    `<div class="ing${g.jar ? ' jar-shape' : ''}" data-ing="${g.key}">
       <div class="bowl"><b style="--c:${g.c}"></b></div>
       <div class="nm">${g.nm}</div>
     </div>`).join('');
  function focusIngredient(id) {
    $('bench').querySelectorAll('.ing').forEach(el =>
      el.classList.toggle('on', el.dataset.ing === id));
  }

  /* ---------------- scenery machines ---------------- */
  $('rail').innerHTML = M.map(m => `<div class="machine" data-m="${m.id}">${m.art()}</div>`).join('');
  const machineEls = {};
  $('rail').querySelectorAll('.machine').forEach(el => { machineEls[el.dataset.m] = el; });
  function focusMachine(id) {
    const order = M.map(m => m.id);
    const active = order.indexOf(id);
    order.forEach((mid, i) => {
      const off = (active < 0 ? (i + 1) : (i - active)) * 132;
      machineEls[mid].style.transform = 'translateX(' + off + 'px)' + (i === active ? '' : ' scale(.82)');
      machineEls[mid].classList.toggle('on', i === active);
    });
  }

  /* ---------------- geometry ---------------- */
  const kit = () => $('kitchen').getBoundingClientRect();
  function cupBox() {
    const k = kit(), c = cupEl.getBoundingClientRect();
    return { top: c.top - k.top, cx: c.left - k.left + c.width / 2 };
  }
  function showZone(on) {
    const z = $('zone'), c = cupBox();
    z.style.left = (c.cx - 76) + 'px';
    z.style.top = (c.top - 96) + 'px';
    z.style.width = '152px';
    z.style.height = '112px';
    z.classList.toggle('show', !!on);
    if (!on) z.classList.remove('hot');
  }

  /* ---------------- pouring feedback ---------------- */
  function stream(on, color, fromX, fromY) {
    const s = $('stream');
    if (!on) { s.classList.remove('on'); return; }
    const c = cupBox();
    s.style.background = color;
    s.style.left = (fromX - 6) + 'px';
    s.style.top = fromY + 'px';
    s.style.height = Math.max(12, (c.top + 30) - fromY) + 'px';
    s.classList.add('on');
  }
  function dropLumps(kind, fromX, fromY) {
    const box = $('lump');
    box.style.left = fromX + 'px';
    box.style.top = fromY + 'px';
    const el = document.createElement('span');
    const ice = kind === 'ice';
    el.style.cssText = `left:${-8 + Math.random() * 16}px;width:${ice ? 15 : 13}px;height:${ice ? 15 : 13}px;
      background:${ice ? '#EAF6FF' : '#2A1017'};border-radius:${ice ? '4px' : '50%'};
      box-shadow:0 1px 3px rgba(0,0,0,.3);`;
    box.appendChild(el);
    setTimeout(() => el.remove(), 560);
  }
  function celebrate() {
    const box = $('burst');
    for (let i = 0; i < 12; i++) {
      const a = (Math.PI * 2 * i) / 12, d = 34 + Math.random() * 26;
      const sp = document.createElement('span');
      sp.style.setProperty('--dx', (Math.cos(a) * d).toFixed(1) + 'px');
      sp.style.setProperty('--dy', (Math.sin(a) * d).toFixed(1) + 'px');
      sp.style.animationDelay = (i * 12) + 'ms';
      box.appendChild(sp);
      setTimeout(() => sp.remove(), 900);
    }
    const p = $('perfect');
    p.classList.remove('go'); void p.offsetWidth; p.classList.add('go');
  }

  /* =====================================================================
     Shared drag plumbing for anything you pick up off the counter
     ===================================================================== */
  function spawnTool(cfg, hint, artArg) {
    const el = document.createElement('div');
    el.className = 'tool';
    el.style.width = cfg.w + 'px';
    el.innerHTML = cfg.art(artArg) + `<span class="tool-hint">${hint}</span>`;
    $('toolLayer').appendChild(el);

    const api = { el };
    api.spout = () => {
      const r = el.getBoundingClientRect(), k2 = kit();
      return { x: r.left - k2.left + r.width * cfg.spout.x,
               y: r.top - k2.top + r.height * cfg.spout.y };
    };
    api.overCup = () => {
      const sp = api.spout(), c = cupBox();
      return Math.abs(sp.x - c.cx) < 82 && sp.y > c.top - 150 && sp.y < c.top + 70;
    };
    // Dropping just clears the inline offsets so the CSS parking spot wins.
    api.goHome = () => {
      el.classList.add('homing');
      el.style.left = ''; el.style.top = '';
      el.style.right = ''; el.style.bottom = '';
      setTimeout(() => el.classList.remove('homing'), 340);
    };
    return api;
  }

  function wireDrag(api, hooks) {
    const el = api.el;
    const S = { held: false, ox: 0, oy: 0 };
    el.addEventListener('pointerdown', e => {
      S.held = true;
      el.classList.remove('homing');
      el.classList.add('held');
      try { el.setPointerCapture(e.pointerId); } catch (err) {}
      const r = el.getBoundingClientRect(), k = kit();
      S.ox = e.clientX - r.left; S.oy = e.clientY - r.top;
      // switch from the CSS parking anchors to explicit coordinates
      el.style.right = 'auto'; el.style.bottom = 'auto';
      el.style.left = (r.left - k.left) + 'px';
      el.style.top = (r.top - k.top) + 'px';
      showZone(true);
      if (hooks.onGrab) hooks.onGrab();
      e.preventDefault();
    });
    el.addEventListener('pointermove', e => {
      if (!S.held) return;
      const k = kit();
      el.style.left = (e.clientX - k.left - S.ox) + 'px';
      el.style.top = (e.clientY - k.top - S.oy) + 'px';
      lookAt(e.clientX);
      const on = api.overCup();
      $('zone').classList.toggle('hot', on);
      if (hooks.onMove) hooks.onMove(on);
    });
    const release = e => {
      if (!S.held) return;
      S.held = false;
      lookAhead();
      el.classList.remove('held');
      const wasOver = api.overCup();
      try { el.releasePointerCapture(e.pointerId); } catch (err) {}
      showZone(false);
      if (hooks.onDrop) hooks.onDrop(wasOver);
    };
    el.addEventListener('pointerup', release);
    el.addEventListener('pointercancel', release);
    return S;
  }

  /* ---- tip-to-pour: kettle, jug, ice scoop, pearl scoop ---- */
  function makePourTool(kindKey, station, opts) {
    const cfg = T[kindKey];
    const api = spawnTool(cfg, opts.hint);
    const P = { on: false, raf: 0 };

    // Pour rate is per second, not per frame, so it feels the same on a
    // 60Hz laptop and a 120Hz phone.
    const RATE = opts.solid ? 72 : 95;

    function start() {
      if (P.on) return;
      P.on = true;
      P.last = performance.now();
      api.el.style.transform = 'rotate(' + cfg.tilt + 'deg)';
      $('chef').classList.add('busy');
      chefFace({ mouth: 'grin', eyes: 'happy' });
      if (!opts.solid) KoraSFX.pourStart();
      // A timer rather than requestAnimationFrame: rAF stops when the page
      // isn't painting, which would silently freeze the pour mid-stream.
      P.raf = setInterval(() => {
        if (!P.on) return;
        const now = performance.now();
        const dt = Math.min(0.12, (now - P.last) / 1000);
        P.last = now;
        const sp = api.spout();
        if (opts.field) V[opts.field] = Math.min(station.max, V[opts.field] + RATE * dt);
        if (opts.solid) {
          if (Math.random() < .3) dropLumps(opts.lump, sp.x, sp.y);
        } else {
          stream(true, cfg.color, sp.x, sp.y);
        }
        cup3d.classList.add('rippling');
        if (opts.solid) { if (Math.random() < .22) KoraSFX.ice(); }
        else KoraSFX.pourLevel((V[opts.field] - station.min) / (station.max - station.min));
        refresh(station);
      }, 16);
    }
    function stop() {
      if (!P.on) return;
      P.on = false;
      clearInterval(P.raf);
      stream(false);
      KoraSFX.pourStop();
      cup3d.classList.remove('rippling');
      api.el.style.transform = '';
      $('chef').classList.remove('busy');
      chefFace({ mouth: 'smile' });
    }

    wireDrag(api, {
      onMove: on => { if (on) start(); else stop(); },
      onDrop: wasOver => {
        stop(); api.goHome();
        if (opts.onDrop) opts.onDrop(wasOver);
        else judge(station);
      }
    });
    return { destroy() { stop(); api.el.remove(); } };
  }

  /* ---- press-to-pump: the syrup bottle ---- */
  function makePump(station) {
    const cfg = T.pump;
    const api = spawnTool(cfg, 'اسحبني وادوس ✋', cfg.color);

    function pumpOnce() {
      const head = api.el.querySelector('.pump-head');
      if (head) { head.style.transform = 'translateY(7px)'; setTimeout(() => { head.style.transform = ''; }, 130); }
      const sp = api.spout();
      KoraSFX.pump();
      V.sweet = Math.min(station.max, V.sweet + 5);
      stream(true, cfg.color, sp.x, sp.y);
      setTimeout(() => stream(false), 200);
      refresh(station);
      cupEl.classList.remove('wobble'); void cupEl.offsetWidth; cupEl.classList.add('wobble');
    }

    // Hold it over the cup and it keeps pumping, one shot at a time, the way
    // a real pump bottle does. Move away or let go and it stops.
    let pumping = null;
    function startPumping() {
      if (pumping) return;
      pumpOnce();
      pumping = setInterval(pumpOnce, 420);
      $('chef').classList.add('busy');
    }
    function stopPumping() {
      if (!pumping) return;
      clearInterval(pumping); pumping = null;
      $('chef').classList.remove('busy');
    }

    wireDrag(api, {
      onGrab: () => { if (api.overCup()) startPumping(); },
      onMove: on => { if (on) startPumping(); else stopPumping(); },
      onDrop: () => { stopPumping(); api.goHome(); judge(station); }
    });
    return { destroy() { stopPumping(); api.el.remove(); } };
  }

  /* ---- scoop of pearls: tip it over the cup to drop a topping in ---- */
  function makePearlScoop(station) {
    return makePourTool('pearlScoop', station, {
      hint: 'اسحبني واقلبني ✋', solid: true, lump: 'pearl',
      onDrop: wasOver => {
        if (!wasOver) return;
        const next = (station.options || []).find(o => !V.toppings.includes(o));
        if (!next) { say('خلاص حطينا كل حاجة يا كبير 😄', 3200); return; }
        V.toppings.push(next);
        KoraSFX.plop();
        paintCup(); refresh(station);
        cupEl.classList.remove('wobble'); void cupEl.offsetWidth; cupEl.classList.add('wobble');
        if (V.toppings.length > 3) { say(pick(SMART.tooMuchBoba), 4600, 'shock'); KoraSFX.ohNo(); }
        else say('زوّدنا ' + next + ' 👌', 2800, 'happy');
      }
    });
  }

  /* ---- lid: drop it on the cup ---- */
  function makeLid(station) {
    const cfg = T.lid;
    const api = spawnTool(cfg, 'حطني على الكوباية ✋');
    const onCup = () => {
      const r = api.el.getBoundingClientRect(), k = kit(), c = cupBox();
      const cx = r.left - k.left + r.width / 2, cy = r.top - k.top + r.height / 2;
      return Math.abs(cx - c.cx) < 74 && Math.abs(cy - c.top) < 66;
    };
    api.overCup = onCup;
    wireDrag(api, {
      onDrop: () => {
        if (onCup()) {
          V.sealed = true; paintCup();
          api.el.style.display = 'none';
          cup3d.classList.remove('spin'); void cup3d.offsetWidth; cup3d.classList.add('spin');
          celebrate(); KoraUI.confetti(60); KoraSFX.seal();
          setTimeout(() => KoraSFX.giggle(), 320);
          say('اتقفلت! تحفة 🎉', 4200, 'happy');
          refresh(station);
        } else api.goHome();
      }
    });
    return { destroy() { api.el.remove(); } };
  }

  /* ---- shaking: grab the cup itself and swing it ---- */
  function makeShaker(station) {
    cupEl.classList.add('grabbable');
    const S = { held: false, lastX: 0, dir: 0 };
    function down(e) {
      S.held = true; S.lastX = e.clientX; S.dir = 0; S.t0 = Date.now(); S.warned = false;
      KoraSFX.shakeStart();
      cupEl.classList.add('grabbing');
      try { cupEl.setPointerCapture(e.pointerId); } catch (err) {}
      e.preventDefault();
    }
    function move(e) {
      if (!S.held) return;
      const dx = e.clientX - S.lastX;
      if (Math.abs(dx) < 9) return;
      const d = dx > 0 ? 1 : -1;
      if (S.dir && d !== S.dir && !V.shaken) {      // each change of direction is one shake
        V.shakes = Math.min(12, V.shakes + 1);
        KoraSFX.rattle();
        refresh(station);
        if (V.shakes >= 12 && !V.shaken) {
          V.shaken = true;
          refresh(station);          // re-paint so the Next button unlocks
          celebrate(); KoraSFX.success();
          say('كده اتخلطت صح! 🎉', 4200, 'happy');
        }
      }
      // shaking well past the point it is mixed
      if (V.shaken && !S.warned && Date.now() - S.t0 > 3500) {
        S.warned = true;
        say(pick(SMART.longShake), 5000, 'shock');
        KoraSFX.ohNo();
      }
      S.dir = d;
      S.lastX = e.clientX;
      lookAt(e.clientX);
      cupEl.style.transform = 'translateZ(50px) rotateZ(' + (d * 9) + 'deg) rotateY(' + (d * 16) + 'deg) translateX(' + (d * 8) + 'px)';
    }
    function up(e) {
      if (!S.held) return;
      S.held = false;
      KoraSFX.shakeStop();
      cupEl.classList.remove('grabbing');
      cupEl.style.transform = '';
      try { cupEl.releasePointerCapture(e.pointerId); } catch (err) {}
    }
    cupEl.addEventListener('pointerdown', down);
    cupEl.addEventListener('pointermove', move);
    cupEl.addEventListener('pointerup', up);
    cupEl.addEventListener('pointercancel', up);
    return { destroy() {
      cupEl.classList.remove('grabbable', 'grabbing');
      cupEl.style.transform = '';
      cupEl.removeEventListener('pointerdown', down);
      cupEl.removeEventListener('pointermove', move);
      cupEl.removeEventListener('pointerup', up);
      cupEl.removeEventListener('pointercancel', up);
      KoraSFX.shakeStop();
    } };
  }

  /* ---- the two cups you can start from ---- */
  function makeChoices(station) {
    const layer = $('choiceLayer');
    layer.innerHTML = '';
    (station.options || []).forEach((o, i) => {
      const big = o.indexOf('كبير') === 0;
      const d = document.createElement('div');
      d.className = 'cup-choice' + (V.cup === o ? ' on' : '');
      // percentages, so this works before the scene has been measured
      d.style.left = (i ? '72%' : '24%');
      d.style.transform = 'translateX(-50%)';
      d.style.bottom = '34px';
      d.innerHTML = `<div class="cc-art" style="width:${big ? 52 : 42}px;height:${big ? 70 : 56}px"></div>
                     <div class="cc-label">${o}</div>`;
      d.onclick = () => {
        V.cup = o; paintCup();
        layer.querySelectorAll('.cup-choice').forEach(x => x.classList.toggle('on', x === d));
        say(big ? 'كبيرة! واحد جدع 😄' : 'عادية وحلوة', 2600, 'happy'); KoraSFX.pop();
      };
      layer.appendChild(d);
    });
  }

  /* ---------------- judging + readout ---------------- */
  const zoneOf = s => ({ lo: Math.round(s.min + (s.max - s.min) * .3),
                         hi: Math.round(s.min + (s.max - s.min) * .7) });
  let lastNag = 0;
  function judge(s) {
    if (s.type !== 'range') return;
    const v = V[s.id], z = zoneOf(s), now = Date.now();
    if (now - lastNag < 1600) return;
    lastNag = now;
    if (s.id === 'ice' && v >= s.max * .8) { say(pick(SMART.tooMuchIce), 4200, 'shock'); KoraSFX.ohNo(); }
    else if (v >= s.max * .96) { say(pick(NAG.much), 3600, 'shock'); KoraSFX.ohNo(); }
    else if (v <= s.max * .08) say(pick(NAG.little), 3400);
    else if (v >= z.lo && v <= z.hi) { celebrate(); KoraSFX.success(); say(pick(NAG.nice), 3200, 'happy'); }
  }

  function refresh(s) {
    paintCup();
    if (s.type === 'range') {
      const v = Math.round(V[s.id]), z = zoneOf(s);
      // written straight out — this ticks 60x a second while pouring, so an
      // easing animation would just fight itself
      const ro = $('ro'); if (ro) ro.innerHTML = v + '<small>' + s.unit + '</small>';
      const bar = $('bar'); if (bar) bar.style.width = ((v - s.min) / (s.max - s.min) * 100) + '%';
      const t = $('tgt');
      if (t) {
        const good = v >= z.lo && v <= z.hi;
        t.className = 'target' + (good ? ' good' : '');
        t.textContent = good ? '✓ مظبوطة كده' : 'صوّب على ' + z.lo + '–' + z.hi + ' ' + s.unit;
      }
    } else if (s.type === 'shake') {
      const bar = $('bar'); if (bar) bar.style.width = (V.shakes / 12 * 100) + '%';
      const ro = $('ro'); if (ro) ro.textContent = V.shaken ? 'اتخلطت!' : V.shakes + '/12';
    } else if (s.type === 'multi') {
      const ro = $('ro'); if (ro) ro.textContent = V.toppings.length ? V.toppings.join(' · ') : 'لسه مفيش';
    } else if (s.type === 'scoops') {
      const ro = $('ro'); if (ro) ro.innerHTML = V.scoops + '<small>' + s.unit + '</small>';
      const dots = $('scoopDots');
      if (dots) {
        let h = '';
        for (let i = 0; i < s.max; i++) h += `<i class="${i < V.scoops ? 'on' : ''}"></i>`;
        dots.innerHTML = h;
      }
    }
    const nx = $('nextBtn');
    if (nx) nx.disabled = !canAdvance(s);
  }

  function canAdvance(s) {
    if (OPTIONAL) return true;
    if (s.type === 'scoops' || s.id === 'style') return true;
    if (s.type === 'range') return V[s.id] > s.min + (s.max - s.min) * .05;
    if (s.type === 'shake') return V.shaken;
    return true;
  }

  /* ---------------- render ---------------- */
  let tool = null;
  function paintProgress() {
    $('prog').innerHTML = ST.map((s, i) =>
      `<i class="${i < idx ? 'done' : (i === idx ? 'now' : '')}"></i>`).join('');
  }

  function render() {
    paintProgress();
    const s = ST[idx];
    if (tool) { tool.destroy(); tool = null; }
    $('choiceLayer').innerHTML = '';
    focusMachine(s.id);
    focusIngredient(s.id);
    paintCup();

    let html = `<h2>${s.title}</h2><p class="hint-txt">${s.hint}</p>`;
    if (s.id === 'style') {
      html += `<div class="style-row">` + s.options.map(o =>
        `<button class="style-pick ${V.style === o ? 'on' : ''}" data-style="${o}">
           <span class="sp-ic">${({'آيس':'🧊','سموزي':'🥤','ميلك شيك':'🍦','ساخن':'☕'})[o] || '🧋'}</span>
           <span>${o}</span></button>`).join('') + `</div>`;
    } else if (s.type === 'scoops') {
      html += `<div class="readout" id="ro">${V.scoops}<small>${s.unit}</small></div>
        <div class="scoop-row">
          <button class="scoop-btn" data-scoop="-1">−</button>
          <div class="scoop-dots" id="scoopDots"></div>
          <button class="scoop-btn" data-scoop="1">+</button>
        </div>`;
    } else if (s.type === 'range') {
      const z = zoneOf(s);
      html += `<div class="readout" id="ro">${Math.round(V[s.id])}<small>${s.unit}</small></div>
        <div class="target" id="tgt">صوّب على ${z.lo}–${z.hi} ${s.unit}</div>
        <div class="gauge"><div class="zone-bar"></div><div class="bar" id="bar"></div></div>
        <div class="fine-row">
          <button class="mini-btn" data-fine="-20">−20</button>
          <button class="mini-btn" data-fine="-5">−5</button>
          <button class="mini-btn" data-fine="5">+5</button>
          <button class="mini-btn" data-fine="20">+20</button>
        </div>
        <div class="preset-row">
          <button class="preset-btn" data-preset="low">شوية</button>
          <button class="preset-btn" data-preset="mid">الظبط</button>
          <button class="preset-btn" data-preset="high">كتير</button>
        </div>
        <button class="step-reset" data-reset="1">فضّي الخطوة دي</button>`;
    } else if (s.type === 'shake') {
      html += `<div class="readout" id="ro">${V.shaken ? 'اتخلطت!' : V.shakes + '/12'}</div>
        <div class="target">امسك الكوباية ورجّها يمين وشمال</div>
        <div class="gauge shake-meter"><div class="bar" id="bar"></div></div>`;
    } else if (s.type === 'multi') {
      html += `<div class="readout" id="ro" style="font-size:1.05rem">لسه مفيش</div>
        <div class="target">اقلب المغرفة فوق الكوباية عشان تضيف</div>
        <div class="preset-row" style="margin-top:12px">
          ${(s.options || []).slice(0, 3).map(o =>
            `<button class="preset-btn" data-addtop="${o}">${o}</button>`).join('')}
        </div>
        <button class="step-reset" data-clear="1">شيل الإضافات كلها</button>`;
    } else if (s.type === 'final') {
      html += `<div class="recap">
          <b>الشكل</b> <span>${V.style || '—'}</span><br>
          <b>الكوباية</b> <span>${V.cup}</span><br>
          <b>الأساس</b> <span>${Math.round(V.brew)} مل${spec.labels ? ' · ' + spec.labels.base : ''}</span><br>
          <b>اللبن</b> <span>${Math.round(V.creamer)} مل${spec.labels ? ' · ' + spec.labels.creamer : ''}</span><br>
          <b>السيرب</b> <span>${Math.round(V.sweet)} مل${spec.labels && spec.labels.flavor.length ? ' · ' + spec.labels.flavor.join(', ') : ''}</span><br>
          <b>سكوب</b> <span>${V.scoops}</span><br>
          <b>التلج</b> <span>${Math.round(V.ice)} جم</span><br>
          <b>الإضافات</b> <span>${V.toppings.length ? V.toppings.join(', ') : 'مفيش'}</span>
        </div>
        <input class="input" id="drinkName" placeholder="سمّي اختراعك"
               value="${V.name ? V.name + '’s blend' : ''}">`;
    }

    html += `<div class="acts">`;
    if (s.type === 'final') {
      html += `<button class="btn btn-primary" id="finishBtn">${OPTIONAL ? 'خلصت' : 'ابعتها للبار'}</button>`;
    } else {
      html += `<button class="btn btn-primary" id="nextBtn">يلا للي بعده</button>`;
      if (idx > 0) html += `<button class="btn btn-ghost" id="backBtn">رجوع</button>`;
      if (OPTIONAL) html += `<button class="btn btn-quiet" id="skipBtn">تخطي الكل</button>`;
    }
    html += `</div>`;
    if (!OPTIONAL && s.type !== 'final') html += `<p class="lock-note">ده مشروب جديد — البار هيعمله بالظبط زي ما ظبطته هنا.</p>`;
    $('panel').innerHTML = html;
    $('panel').classList.remove('enter'); void $('panel').offsetWidth; $('panel').classList.add('enter');

    /* hand over the right tool */
    if (s.id === 'cup') makeChoices(s);
    else if (s.id === 'brew') tool = makePourTool('kettle', s, { hint: 'اسحبني فوق الكوباية ✋', field: 'brew' });
    else if (s.id === 'creamer') tool = makePourTool('jug', s, { hint: 'اسحبني فوق الكوباية ✋', field: 'creamer' });
    else if (s.id === 'sweet') tool = makePump(s);
    else if (s.id === 'toppings') tool = makePearlScoop(s);
    else if (s.id === 'ice') tool = makePourTool('iceScoop', s, { hint: 'اسحبني واقلبني ✋', field: 'ice', solid: true, lump: 'ice' });
    else if (s.type === 'shake') tool = makeShaker(s);
    else if (s.id === 'seal') { V.sealed = false; paintCup(); tool = makeLid(s); }

    wire(s);
    refresh(s);
    if (GUIDE[s.id]) say(GUIDE[s.id], 5200);
  }

  function wire(s) {
    /* --- drink style --- */
    $('panel').querySelectorAll('[data-style]').forEach(b => {
      b.onclick = () => {
        V.style = b.dataset.style;
        $('panel').querySelectorAll('[data-style]').forEach(x => x.classList.toggle('on', x === b));
        KoraSFX.pop();
        say('تمام، ' + V.style + ' 👌', 2600, 'happy');
      };
    });

    /* --- scoops --- */
    $('panel').querySelectorAll('[data-scoop]').forEach(b => {
      b.onclick = () => {
        const next = Math.max(s.min, Math.min(s.max, V.scoops + Number(b.dataset.scoop)));
        if (next === V.scoops) return;
        const up = next > V.scoops;
        V.scoops = next;
        if (up) KoraSFX.plop(); else KoraSFX.pop();
        if (V.scoops >= 4) { say(pick(SMART.heavy), 4000, 'shock'); KoraSFX.ohNo(); }
        refresh(s);
      };
    });

    /* --- cup size --- */
    $('panel').querySelectorAll('[data-cup]').forEach(b => {
      b.onclick = () => { V.cup = b.dataset.cup; paintCup(); render(); };
    });

    /* --- toppings picked straight off the list --- */
    $('panel').querySelectorAll('[data-top]').forEach(b => {
      b.onclick = () => {
        const t = b.dataset.top, i = V.toppings.indexOf(t);
        if (i > -1) { V.toppings.splice(i, 1); KoraSFX.pop(); }
        else { V.toppings.push(t); KoraSFX.plop(); }
        if (V.toppings.length > 3) { say(pick(SMART.tooMuchBoba), 4600, 'shock'); KoraSFX.ohNo(); }
        render();
      };
    });

    /* --- precise nudges, for when dragging is not exact enough --- */
    $('panel').querySelectorAll('[data-fine]').forEach(b => {
      b.onclick = () => {
        const step = Number(b.dataset.fine);
        const was = V[s.id];
        V[s.id] = Math.max(0, Math.min(s.max, V[s.id] + step));
        if (V[s.id] === was) { KoraSFX.ohNo(); return; }
        KoraSFX.pop();
        cupEl.classList.remove('wobble'); void cupEl.offsetWidth; cupEl.classList.add('wobble');
        refresh(s); judge(s);
      };
    });

    /* --- one tap for a light / spot-on / heavy pour --- */
    $('panel').querySelectorAll('[data-preset]').forEach(b => {
      b.onclick = () => {
        const z = zoneOf(s);
        const to = b.dataset.preset === 'low'  ? Math.round(s.min + (z.lo - s.min) * .55)
                 : b.dataset.preset === 'high' ? Math.round(z.hi + (s.max - z.hi) * .55)
                 : Math.round((z.lo + z.hi) / 2);
        V[s.id] = Math.max(0, Math.min(s.max, to));
        $('panel').querySelectorAll('[data-preset]').forEach(x => x.classList.toggle('on', x === b));
        KoraSFX.plop();
        cupEl.classList.remove('wobble'); void cupEl.offsetWidth; cupEl.classList.add('wobble');
        refresh(s); judge(s);
      };
    });

    /* --- start the step over --- */
    const rs = $('panel').querySelector('[data-reset]');
    if (rs) rs.onclick = () => {
      V[s.id] = 0;
      KoraSFX.pop();
      say('مسحناها، ابدأ من الأول 🧽', 2800);
      refresh(s);
    };

    /* --- add a topping straight from the card --- */
    $('panel').querySelectorAll('[data-addtop]').forEach(b => {
      b.onclick = () => {
        const t = b.dataset.addtop;
        if (V.toppings.includes(t)) { say('ده موجود بالفعل يا معلم 😄', 2600); KoraSFX.ohNo(); return; }
        V.toppings.push(t);
        KoraSFX.plop();
        cupEl.classList.remove('wobble'); void cupEl.offsetWidth; cupEl.classList.add('wobble');
        if (V.toppings.length > 3) { say(pick(SMART.tooMuchBoba), 4600, 'shock'); KoraSFX.ohNo(); }
        else say('زوّدنا ' + t + ' 👌', 2600, 'happy');
        refresh(s);
      };
    });
    const cl = $('panel').querySelector('[data-clear]');
    if (cl) cl.onclick = () => {
      V.toppings = [];
      KoraSFX.pop();
      say('شيلنا كل الإضافات', 2600);
      refresh(s);
    };

    const n = $('nextBtn');
    if (n) n.onclick = () => {
      if (!canAdvance(s)) { say('لسه مخلصناش الخطوة دي يا معلم', 3400, 'shock'); KoraSFX.ohNo(); return; }
      idx = Math.min(ST.length - 1, idx + 1);
      KoraSFX.pop();
      render();
    };
    const b = $('backBtn');
    if (b) b.onclick = () => { idx = Math.max(0, idx - 1); render(); };
    const sk = $('skipBtn');
    if (sk) sk.onclick = () => { idx = ST.length - 1; V.sealed = true; render(); };
    const f = $('finishBtn');
    if (f) f.onclick = finish;
  }

  function finish() {
    localStorage.removeItem('kora_kitchen_spec');
    const madeByHand = {
      style: V.style, cup: V.cup, scoops: V.scoops,
      brew: Math.round(V.brew), creamer: Math.round(V.creamer),
      sweet: Math.round(V.sweet), ice: Math.round(V.ice),
      toppings: V.toppings, shaken: V.shaken
    };

    // Play mode still counts: the measurements ride back with the drink so
    // the bar makes it the way the customer just made it.
    if (OPTIONAL) {
      if (spec.item) {
        localStorage.setItem('kora_custom_result', JSON.stringify(
          Object.assign({}, spec.item, { id: 'i' + Date.now(), handmade: true, kitchen: madeByHand })
        ));
      }
      location.href = 'guest.html';
      return;
    }
    const nameField = $('drinkName');
    const name = (nameField && nameField.value.trim()) || 'Custom Blend';
    localStorage.setItem('kora_custom_result', JSON.stringify({
      id: 'i' + Date.now(), kind: 'custom', name, qty: 1, toppings: [],
      build_price: spec.build_price || 0,
      selections: spec.selections || null,
      labels: spec.labels || null,
      kitchen: madeByHand
    }));
    location.href = 'guest.html';
  }

  KoraSFX.mountToggle($('brandSlot').parentElement);
  KoraAPI.ready().then(() => { render(); maybeWeirdMix(); touchIdle(); }).catch(render);

  // the whole room leans toward wherever you are pointing
  (function () {
    const stage = $('kitchen'), inner = $('kitchen3d');
    let raf = 0, rx = 0, ry = 0;
    const apply = () => { raf = 0; inner.style.transform = `rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg)`; };
    stage.addEventListener('pointermove', e => {
      const r = stage.getBoundingClientRect();
      ry = ((e.clientX - r.left) / r.width - .5) * 9;
      rx = -((e.clientY - r.top) / r.height - .5) * 7;
      if (!raf) raf = requestAnimationFrame(apply);
    });
    stage.addEventListener('pointerleave', () => { rx = 0; ry = 0; if (!raf) raf = requestAnimationFrame(apply); });
  })();
})();
</script>
</body>
</html>
