<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Kitchen — Kora</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<style>
  body { background: #F4F4F6; overflow-x: hidden; }

  /* ---------------- top bar ---------------- */
  .k-top { background: linear-gradient(120deg, var(--gray-950), var(--wine-900)); color: #fff; padding: 12px 0; }
  .k-top .container { display: flex; align-items: center; justify-content: space-between; }
  .k-mode { font-size: .68rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--wine-300); }

  /* ---------------- progress ---------------- */
  .progress { display: flex; gap: 4px; max-width: 540px; margin: 12px auto 0; padding: 0 20px; }
  .progress i { flex: 1; height: 5px; border-radius: 3px; background: var(--gray-200); transition: background .3s; }
  .progress i.done { background: var(--wine-500); }
  .progress i.now  { background: var(--wine-700); box-shadow: 0 0 0 3px rgba(123,30,62,.16); }

  /* ================= THE KITCHEN ================= */
  .kitchen {
    position: relative; max-width: 560px; margin: 14px auto 0;
    border-radius: var(--r-xl) var(--r-xl) 0 0; overflow: hidden;
    box-shadow: var(--sh-3);
  }

  /* wall + tiles */
  .wall {
    position: relative; height: 268px;
    background:
      repeating-linear-gradient(0deg,  rgba(0,0,0,.045) 0 1px, transparent 1px 34px),
      repeating-linear-gradient(90deg, rgba(0,0,0,.045) 0 1px, transparent 1px 34px),
      linear-gradient(180deg, #E4F1EC, #D2E7E0);
  }
  /* shelf with jars */
  .shelf { position: absolute; top: 8px; left: 0; right: 0; height: 52px; }
  .shelf .board { position: absolute; bottom: 0; left: 22px; right: 22px; height: 8px; border-radius: 4px; background: #C08A52; box-shadow: 0 3px 0 rgba(0,0,0,.09); }
  .shelf .jar { position: absolute; bottom: 8px; width: 20px; border-radius: 4px 4px 3px 3px; }
  .shelf .jar::before { content: ''; position: absolute; top: -5px; left: -2px; right: -2px; height: 6px; border-radius: 3px; background: #9AA3AE; }

  /* machine rail — the active machine slides above the cup */
  .rail { position: absolute; left: 50%; top: 44px; width: 120px; height: 130px; }
  .rail .machine {
    position: absolute; top: 0; width: 120px; height: 130px;
    transition: transform .5s cubic-bezier(.3,.9,.35,1), opacity .4s ease, filter .4s ease;
    opacity: .3; filter: saturate(.45); transform-origin: 60px 120px;
  }
  .rail .machine svg { width: 100%; height: 100%; display: block; }
  .rail .machine.on { opacity: 1; filter: none; }
  .rail .machine.on.pouring { animation: machine-shake .5s ease-in-out infinite; }
  @keyframes machine-shake { 0%,100% { transform: translate(var(--x), 0); } 50% { transform: translate(var(--x), 2px); } }

  .machine-tag {
    position: absolute; bottom: 10px; left: 12px;
    background: rgba(18,18,20,.72); color: #fff; padding: 4px 12px; border-radius: 999px;
    font-size: .7rem; font-weight: 600; white-space: nowrap;
    transition: opacity .3s ease;
  }

  /* the pouring stream */
  .stream {
    position: absolute; left: 50%; margin-left: -7px; top: 168px;
    width: 14px; height: 62px; border-radius: 0 0 7px 7px;
    transform-origin: top center; transform: scaleY(0); opacity: 0;
    transition: transform .16s ease, opacity .16s ease; z-index: 4;
  }
  .stream.on { transform: scaleY(1); opacity: 1; }
  .stream::after {
    content: ''; position: absolute; bottom: -5px; left: -3px;
    width: 20px; height: 15px; border-radius: 50%; background: inherit;
    animation: splat .38s ease-in-out infinite;
  }
  @keyframes splat { 0%,100% { transform: scale(1); } 50% { transform: scale(1.3,.75); } }

  /* falling solids (ice cubes / pearls) */
  .lump { position: absolute; left: 50%; top: 166px; z-index: 4; pointer-events: none; }
  .lump span { position: absolute; border-radius: 4px; animation: fall .55s cubic-bezier(.5,0,.9,.3) forwards; }
  @keyframes fall { from { transform: translateY(0) rotate(0); opacity: 1; } to { transform: translateY(70px) rotate(180deg); opacity: 0; } }

  /* counter */
  .counter { position: relative; height: 74px; background: linear-gradient(180deg, #D9A96B, #C08A52); }
  .counter::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 9px; background: #E6BE86; }
  .counter::after  { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 12px; background: rgba(0,0,0,.13); }

  /* the cup being made — straddles wall + counter */
  .cup-stage {
    position: absolute; left: 50%; margin-left: -65px; bottom: 24px;
    width: 130px; height: 165px; z-index: 3;
    transition: transform .3s ease;
  }
  .cup-stage.shaking { animation: cup-shake .34s ease-in-out infinite; }
  @keyframes cup-shake {
    0%,100% { transform: translate(0,0) rotate(0); }
    25% { transform: translate(-9px,-7px) rotate(-7deg); }
    75% { transform: translate(9px,-7px) rotate(7deg); }
  }
  .cup-stage svg { width: 100%; height: 100%; overflow: visible; }
  .wc-lid { opacity: 0; transition: opacity .3s ease, transform .3s ease; transform: translateY(-14px); }
  .cup-stage.sealed .wc-lid { opacity: 1; transform: translateY(0); }
  .wc-syrup, .wc-tea, .wc-milk { transition: y .35s cubic-bezier(.3,.9,.4,1); }

  /* cup size choices sitting on the counter */
  .cup-picks { display: flex; gap: 14px; justify-content: center; }
  .cup-pick {
    border: 2px solid var(--gray-300); background: var(--surface); border-radius: var(--r-md);
    padding: 12px 16px 10px; cursor: pointer; font-family: inherit; text-align: center;
    transition: all .18s ease;
  }
  .cup-pick:hover { border-color: var(--wine-300); transform: translateY(-2px); }
  .cup-pick.on { border-color: var(--wine-700); background: var(--wine-50); }
  .cup-pick .cp-art { display: block; margin: 0 auto 6px; background: var(--gray-200); border-radius: 3px 3px 8px 8px; }
  .cup-pick .cp-label { font-size: .78rem; font-weight: 600; }

  /* ================= CONTROLS ================= */
  .panel {
    max-width: 560px; margin: 0 auto; background: var(--surface);
    border-radius: 0 0 var(--r-xl) var(--r-xl);
    padding: 20px 22px 26px; box-shadow: var(--sh-2); text-align: center;
  }
  .panel h2 { font-size: 1.2rem; margin-bottom: 4px; }
  .panel .hint-txt { color: var(--text-soft); font-size: .86rem; margin: 0 0 16px; }

  .readout { font-family: var(--ff-display); font-size: 2.2rem; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
  .readout small { font-size: .95rem; font-weight: 500; color: var(--text-faint); margin-left: 4px; }
  .target { font-size: .74rem; color: var(--text-faint); margin-top: 2px; }
  .target.good { color: var(--success); font-weight: 600; }

  .gauge { height: 8px; border-radius: 5px; background: var(--gray-200); margin: 14px 0 4px; position: relative; overflow: hidden; }
  .gauge .zone { position: absolute; top: 0; bottom: 0; background: rgba(31,122,77,.22); }
  .gauge .bar { position: absolute; top: 0; bottom: 0; left: 0; background: var(--wine-700); border-radius: 5px; transition: width .12s linear; }

  .pour-row { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 14px; }
  .nudge {
    width: 46px; height: 46px; border-radius: 14px; border: 1px solid var(--border);
    background: var(--surface); font-size: 1.3rem; cursor: pointer; color: var(--text);
    box-shadow: var(--sh-1);
  }
  .nudge:hover { background: var(--gray-50); }
  .pour-btn {
    flex: 1; max-width: 250px; padding: 15px 20px; border-radius: 16px; border: none;
    background: var(--wine-700); color: #fff; font-family: inherit; font-weight: 700; font-size: 1rem;
    cursor: pointer; box-shadow: var(--sh-wine); user-select: none; touch-action: none;
  }
  .pour-btn:active, .pour-btn.holding { transform: translateY(2px); background: var(--wine-600); }

  .bin-row { display: flex; flex-wrap: wrap; gap: 9px; justify-content: center; }
  .bin {
    display: flex; align-items: center; gap: 8px;
    border: 2px solid var(--gray-300); background: var(--surface);
    border-radius: var(--r-md); padding: 9px 14px; cursor: pointer;
    font-family: inherit; font-size: .85rem; font-weight: 500; transition: all .16s ease;
  }
  .bin .dot { width: 13px; height: 13px; border-radius: 50%; background: #2A1017; }
  .bin:hover { border-color: var(--wine-300); }
  .bin.on { background: var(--wine-700); border-color: var(--wine-700); color: #fff; }

  .recap { text-align: left; background: var(--gray-50); border: 1px solid var(--border); border-radius: var(--r-md); padding: 14px 16px; margin-bottom: 14px; font-size: .85rem; line-height: 1.9; }
  .recap b { color: var(--text); }
  .recap span { color: var(--text-soft); }

  .acts { display: flex; gap: 10px; margin-top: 18px; }
  .acts .btn { flex: 1; }
  .lock-note { font-size: .75rem; color: var(--text-faint); margin-top: 12px; }

  @media (max-width: 560px) {
    .kitchen, .panel { border-radius: 0; }
    .wall { height: 210px; }
    .cup-stage { transform: scale(.9); }
  }
  @media (prefers-reduced-motion: reduce) {
    .rail .machine, .cup-stage, .stream, .lump span { transition: none; animation: none; }
  }
</style>
</head>
<body>

<div class="k-top">
  <div class="container">
    <div id="brandSlot"></div>
    <span class="k-mode" id="modeTag"></span>
  </div>
</div>

<div class="progress" id="prog"></div>

<div class="kitchen">
  <div class="wall">
    <div class="shelf">
      <div class="board"></div>
      <div class="jar" style="left:14%;height:26px;background:#C2334D"></div>
      <div class="jar" style="left:24%;height:34px;background:#8A5525"></div>
      <div class="jar" style="left:33%;height:22px;background:#5C8A4A"></div>
      <div class="jar" style="left:60%;height:30px;background:#D19A1D"></div>
      <div class="jar" style="left:69%;height:24px;background:#8E6BAF"></div>
      <div class="jar" style="left:78%;height:32px;background:#7B1E3E"></div>
    </div>
    <div class="rail" id="rail"></div>
    <div class="machine-tag" id="mTag"></div>
    <div class="stream" id="stream"></div>
    <div class="lump" id="lump"></div>
  </div>
  <div class="counter"></div>
  <div class="cup-stage" id="cupStage"></div>
</div>

<div class="panel" id="panel"></div>

<script src="assets/supabase-config.js"></script>
<script src="assets/data.js"></script>
<script src="assets/api.js"></script>
<script src="assets/ui.js"></script>
<script src="assets/kitchen-art.js"></script>
<script>
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const C = KoraAPI.catalog;
  const M = KoraKitchen.machines;

  let spec = null;
  try { spec = JSON.parse(localStorage.getItem('kora_kitchen_spec') || 'null'); } catch (e) {}
  if (!spec) { location.replace('guest.html'); return; }

  const OPTIONAL = spec.mode === 'optional';
  const ST = C.stations || [];
  let idx = 0;

  const V = { cup: 'Regular 500ml', brew: 180, creamer: 150, sweet: 25, ice: 90,
              toppings: [], shaken: false, sealed: false, name: spec.customer || '' };

  $('brandSlot').innerHTML = KoraUI.brandMark({ size: 26, tagline: false, onDark: true, color: '#fff' });
  $('modeTag').textContent = OPTIONAL ? 'Play mode · skippable' : 'Every step counts';

  /* ---------------- build the machine rail once ---------------- */
  $('rail').innerHTML = M.filter(m => m.id !== 'cup')
    .map(m => `<div class="machine" data-m="${m.id}">${m.art()}</div>`).join('');
  const machineEls = {};
  $('rail').querySelectorAll('.machine').forEach(el => { machineEls[el.dataset.m] = el; });

  // Slide the rail so the active machine sits centred above the cup.
  function focusMachine(id) {
    const order = M.filter(m => m.id !== 'cup').map(m => m.id);
    const active = order.indexOf(id);
    order.forEach((mid, i) => {
      const el = machineEls[mid];
      // With no active machine (the cup-picking step) slide the whole rail
      // off to the side so nothing hovers over the cup.
      const offset = (active < 0 ? (i + 1) : (i - active)) * 132;
      el.style.setProperty('--x', offset + 'px');
      el.style.transform = 'translateX(' + offset + 'px)' + (i === active ? '' : ' scale(.8)');
      el.classList.toggle('on', i === active);
    });
    const m = M.find(x => x.id === id);
    $('mTag').textContent = m ? m.name : '';
    $('mTag').style.opacity = m ? '1' : '0';
  }

  /* ---------------- the cup ---------------- */
  $('cupStage').innerHTML = KoraKitchen.workCup();
  const cupEl = $('cupStage');

  // Liquid layers stack from the bottom of the cup upward.
  // Cup interior runs y≈44 (top) to y≈174 (bottom) in the SVG.
  const CUP_TOP = 44, CUP_BOTTOM = 174, CUP_H = CUP_BOTTOM - CUP_TOP;
  function paintCup() {
    const size = V.cup.indexOf('Large') === 0 ? 1.25 : 1;
    const cap = 480 * size;                       // total ml the cup can hold
    const syr = Math.min(1, V.sweet / cap);
    const tea = Math.min(1, V.brew / cap);
    const milk = Math.min(1, V.creamer / cap);

    let acc = 0;
    const setLayer = (cls, frac) => {
      acc += frac;
      const h = Math.min(1, acc) * CUP_H;
      cupEl.querySelector(cls).setAttribute('y', (CUP_BOTTOM - h).toFixed(1));
    };
    setLayer('.wc-syrup', syr);
    setLayer('.wc-tea', tea);
    setLayer('.wc-milk', milk);

    // ice cubes floating near the surface
    const iceN = Math.round(V.ice / 34);
    let ice = '';
    for (let i = 0; i < iceN; i++) {
      const x = 36 + (i % 4) * 22, y = 58 + Math.floor(i / 4) * 20;
      ice += `<rect x="${x}" y="${y}" width="17" height="17" rx="4" fill="#fff" opacity=".72"
               transform="rotate(${(i * 37) % 40 - 20} ${x + 8} ${y + 8})"/>`;
    }
    cupEl.querySelector('.wc-ice').innerHTML = ice;

    // pearls settle at the bottom
    const pN = Math.min(12, 4 + V.toppings.length * 3);
    let pearls = '';
    for (let i = 0; i < pN; i++) {
      const row = Math.floor(i / 4);
      pearls += `<circle cx="${44 + (i % 4) * 22 + (row % 2 ? 9 : 0)}" cy="${162 - row * 17}" r="8"
                  fill="#2A1017" opacity=".85"/>`;
    }
    cupEl.querySelector('.wc-pearls').innerHTML = pearls;
    cupEl.classList.toggle('sealed', V.sealed);
  }

  /* ---------------- pouring feedback ---------------- */
  let lumpTimer;
  function startPour(station) {
    const m = M.find(x => x.id === station.id);
    const solid = station.id === 'ice' || station.id === 'toppings';
    if (solid) {
      dropLumps(station.id);
      clearInterval(lumpTimer);
      lumpTimer = setInterval(() => dropLumps(station.id), 180);
    } else {
      const s = $('stream');
      s.style.background = m ? m.color : 'var(--wine-700)';
      s.classList.add('on');
    }
    if (machineEls[station.id]) machineEls[station.id].classList.add('pouring');
  }
  function stopPour(station) {
    $('stream').classList.remove('on');
    clearInterval(lumpTimer);
    if (machineEls[station.id]) machineEls[station.id].classList.remove('pouring');
  }
  function dropLumps(kind) {
    const box = $('lump');
    const el = document.createElement('span');
    const ice = kind === 'ice';
    el.style.cssText = `left:${-10 + Math.random() * 20}px;width:${ice ? 15 : 12}px;height:${ice ? 15 : 12}px;
      background:${ice ? 'rgba(255,255,255,.9)' : '#2A1017'};border-radius:${ice ? '4px' : '50%'};`;
    box.appendChild(el);
    setTimeout(() => el.remove(), 600);
  }

  /* ---------------- progress ---------------- */
  function paintProgress() {
    $('prog').innerHTML = ST.map((s, i) =>
      `<i class="${i < idx ? 'done' : (i === idx ? 'now' : '')}"></i>`).join('');
  }

  /* ---------------- render a station ---------------- */
  function render() {
    paintProgress();
    const s = ST[idx];
    focusMachine(s.id === 'cup' ? null : s.id);
    paintCup();

    let html = `<h2>${s.title}</h2><p class="hint-txt">${s.hint}</p>`;

    if (s.type === 'choice') {
      html += `<div class="cup-picks">` + s.options.map(o => {
        const big = o.indexOf('Large') === 0;
        return `<button class="cup-pick ${V.cup === o ? 'on' : ''}" data-cup="${o}">
            <span class="cp-art" style="width:${big ? 40 : 32}px;height:${big ? 54 : 44}px"></span>
            <span class="cp-label">${o}</span>
          </button>`;
      }).join('') + `</div>`;
    }
    else if (s.type === 'range') {
      const v = V[s.id];
      const lo = Math.round(s.min + (s.max - s.min) * .3), hi = Math.round(s.min + (s.max - s.min) * .7);
      const pct = ((v - s.min) / (s.max - s.min)) * 100;
      const inZone = v >= lo && v <= hi;
      html += `<div class="readout" id="ro">${v}<small>${s.unit}</small></div>
        <div class="target ${inZone ? 'good' : ''}" id="tgt">${inZone ? '✓ right in the sweet spot' : 'aim for ' + lo + '–' + hi + s.unit}</div>
        <div class="gauge">
          <div class="zone" style="left:30%;width:40%"></div>
          <div class="bar" id="bar" style="width:${pct}%"></div>
        </div>
        <div class="pour-row">
          <button class="nudge" data-step="-5">−</button>
          <button class="pour-btn" id="pourBtn">Hold to pour</button>
          <button class="nudge" data-step="5">+</button>
        </div>`;
    }
    else if (s.type === 'multi') {
      html += `<div class="bin-row">` + s.options.map(o =>
        `<button class="bin ${V.toppings.includes(o) ? 'on' : ''}" data-top="${o}">
           <span class="dot"></span>${o}</button>`).join('') + `</div>`;
    }
    else if (s.type === 'shake') {
      html += V.shaken
        ? `<p style="color:var(--success);font-weight:600;margin:6px 0 0">Nicely mixed.</p>`
        : `<button class="btn btn-primary btn-lg" id="shakeBtn">Shake it</button>`;
    }
    else if (s.type === 'final') {
      html += `<div class="recap">
          <b>Cup</b> <span>${V.cup}</span><br>
          <b>Base</b> <span>${V.brew} ml${spec.labels ? ' · ' + spec.labels.base : ''}</span><br>
          <b>Creamer</b> <span>${V.creamer} ml${spec.labels ? ' · ' + spec.labels.creamer : ''}</span><br>
          <b>Syrup</b> <span>${V.sweet} ml${spec.labels && spec.labels.flavor.length ? ' · ' + spec.labels.flavor.join(', ') : ''}</span><br>
          <b>Ice</b> <span>${V.ice} g</span><br>
          <b>Toppings</b> <span>${V.toppings.length ? V.toppings.join(', ') : 'none'}</span>
        </div>
        <input class="input" id="drinkName" placeholder="Name your creation"
               value="${V.name ? V.name + '’s blend' : ''}" style="margin-bottom:6px">`;
    }

    html += `<div class="acts">`;
    if (s.type === 'final') {
      html += `<button class="btn btn-primary" id="finishBtn">${OPTIONAL ? 'Done' : 'Send to the bar'}</button>`;
    } else {
      html += `<button class="btn btn-primary" id="nextBtn">Next</button>`;
      if (idx > 0) html += `<button class="btn btn-ghost" id="backBtn">Back</button>`;
      if (OPTIONAL) html += `<button class="btn btn-quiet" id="skipBtn">Skip all</button>`;
    }
    html += `</div>`;
    if (!OPTIONAL && s.type !== 'final') {
      html += `<p class="lock-note">Brand-new drink — the bar makes it exactly as you set it here.</p>`;
    }

    $('panel').innerHTML = html;
    wire(s);
  }

  /* ---------------- wiring ---------------- */
  function wire(s) {
    const next = $('nextBtn');
    if (next) next.onclick = () => {
      if (s.type === 'shake' && !V.shaken) { KoraUI.mascot.blocked(); KoraUI.toast('Give it a proper shake first'); return; }
      idx = Math.min(ST.length - 1, idx + 1);
      if (ST[idx].type === 'final') { V.sealed = true; }
      render();
    };
    const back = $('backBtn');
    if (back) back.onclick = () => { idx = Math.max(0, idx - 1); V.sealed = false; render(); };
    const skip = $('skipBtn');
    if (skip) skip.onclick = () => { idx = ST.length - 1; V.sealed = true; render(); };

    $('panel').querySelectorAll('[data-cup]').forEach(b => {
      b.onclick = () => { V.cup = b.dataset.cup; render(); };
    });
    $('panel').querySelectorAll('[data-top]').forEach(b => {
      b.onclick = () => {
        const t = b.dataset.top, i = V.toppings.indexOf(t);
        if (i > -1) V.toppings.splice(i, 1);
        else { V.toppings.push(t); dropLumps('toppings'); }
        if (V.toppings.length > 4) KoraUI.mascot.tooMuch();
        render();
      };
    });

    /* --- hold-to-pour --- */
    const pourBtn = $('pourBtn');
    if (pourBtn) {
      const apply = (delta) => {
        const before = V[s.id];
        V[s.id] = Math.max(s.min, Math.min(s.max, V[s.id] + delta));
        if (V[s.id] === before) return false;
        refreshRange(s);
        return true;
      };
      let raf, holding = false;
      const tick = () => { if (!holding) return; if (!apply(2)) { end(); return; } raf = requestAnimationFrame(tick); };
      const begin = (e) => {
        e.preventDefault();
        if (holding) return;
        holding = true; pourBtn.classList.add('holding');
        startPour(s); tick();
      };
      const end = () => {
        if (!holding) return;
        holding = false; pourBtn.classList.remove('holding');
        cancelAnimationFrame(raf); stopPour(s);
        const v = V[s.id];
        if (v >= s.max * .95) KoraUI.mascot.tooMuch();
        else if (s.min === 0 && v <= s.max * .06) KoraUI.mascot.tooLittle();
        else if (Math.random() < .35) KoraUI.mascot.working();
      };
      pourBtn.addEventListener('pointerdown', begin);
      ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => pourBtn.addEventListener(ev, end));
      window.addEventListener('blur', end);

      $('panel').querySelectorAll('.nudge').forEach(b => {
        b.onclick = () => { apply(Number(b.dataset.step)); };
      });
    }

    const shake = $('shakeBtn');
    if (shake) shake.onclick = () => {
      V.shaken = true;
      cupEl.classList.add('shaking');
      KoraUI.mascot.working();
      setTimeout(() => { cupEl.classList.remove('shaking'); render(); }, 1500);
    };

    const fin = $('finishBtn');
    if (fin) fin.onclick = finish;
  }

  function refreshRange(s) {
    const v = V[s.id];
    const ro = $('ro'); if (ro) ro.innerHTML = v + '<small>' + s.unit + '</small>';
    const bar = $('bar'); if (bar) bar.style.width = (((v - s.min) / (s.max - s.min)) * 100) + '%';
    const lo = Math.round(s.min + (s.max - s.min) * .3), hi = Math.round(s.min + (s.max - s.min) * .7);
    const tgt = $('tgt');
    if (tgt) {
      const inZone = v >= lo && v <= hi;
      tgt.className = 'target' + (inZone ? ' good' : '');
      tgt.textContent = inZone ? '✓ right in the sweet spot' : 'aim for ' + lo + '–' + hi + s.unit;
    }
    paintCup();
  }

  /* ---------------- done ---------------- */
  function finish() {
    localStorage.removeItem('kora_kitchen_spec');
    if (OPTIONAL) { location.href = 'guest.html'; return; }
    const nameField = $('drinkName');
    const name = (nameField && nameField.value.trim()) || 'Custom Blend';
    localStorage.setItem('kora_custom_result', JSON.stringify({
      id: 'i' + Date.now(), kind: 'custom', name, qty: 1, toppings: [],
      build_price: spec.build_price || 0,
      selections: spec.selections || null,
      labels: spec.labels || null,
      kitchen: { cup: V.cup, brew: V.brew, creamer: V.creamer,
                 sweet: V.sweet, ice: V.ice, toppings: V.toppings, shaken: V.shaken }
    }));
    location.href = 'guest.html';
  }

  KoraAPI.ready().then(render).catch(render);
})();
</script>
</body>
</html>
